name: Скачать записи и портреты

on:
  push:
    branches: [main]
    paths: ["media.json", "tools/fetch_media.py", ".github/workflows/fetch-media.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch media
        run: python3 tools/fetch_media.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portraits audio/real tools/last_fetch.txt
          git diff --cached --quiet || git commit -m "Записи и портреты с Wikimedia"
          git push
