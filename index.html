<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Антракт</title>
<meta name="description" content="Классическая музыка мини-уроками">
<meta name="theme-color" content="#EEF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Антракт">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: one phone-width column — status strip, one card at a time, staff-line progress, tab bar. */
:root {
  --bg: #EEF0EB;          /* cool staff-paper */
  --surface: #FAFAF7;
  --ink: #17191E;
  --muted: #5D636E;
  --line: #D6D9D1;
  --ok: #2E7D4F;
  --bad: #B23A3A;
  --baroque: #9A6A12;
  --classical: #2F5D9E;
  --romantic: #9C2F45;
  --modern: #24766D;
  --intro: #555A66;
  --listen: #5E4BA8;
  --era: var(--intro);
  --f-display: "Prata", "Georgia", "Times New Roman", serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1A1C21; --ink: #ECEDE8; --muted: #9BA1AB; --line: #2B2E35;
  --ok: #5BBF85; --bad: #E07070;
  --baroque: #D9A541; --classical: #7FA6E0; --romantic: #E07A8F; --modern: #5FC2B6; --intro: #A3A8B3; --listen: #A898EE;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1C21; --ink: #ECEDE8; --muted: #9BA1AB; --line: #2B2E35;
  --ok: #5BBF85; --bad: #E07070;
  --baroque: #D9A541; --classical: #7FA6E0; --romantic: #E07A8F; --modern: #5FC2B6; --intro: #A3A8B3; --listen: #A898EE;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--era); outline-offset: 3px; border-radius: 6px; }

/* status strip */
.top { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; font-family: var(--f-mono); font-size: 12px;
  letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.top .brand { font-family: var(--f-display); font-size: 19px; letter-spacing: 0; color: var(--ink); margin-right: auto; cursor: pointer; }
.top b { color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 5px; }
.chip svg { width: 14px; height: 14px; }

/* screens */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 8px 24px; }

/* lesson header */
.lhead { display: flex; align-items: baseline; gap: 10px; padding-block: 6px 2px; min-width: 0; }
.lhead .num { font-family: var(--f-mono); font-size: 12px; color: var(--era); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.lhead .ttl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* stories progress */
.staff { margin-block: 6px 8px; min-height: 4px; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
.segs i.f { background: var(--era); }
.segs i.c::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--era); border-radius: 2px; animation: segfill 1.4s ease-out both; }
@keyframes segfill { from { width: 0; } to { width: 35%; } }
@media (prefers-reduced-motion: reduce) { .segs i.c::after { animation: none; } }
.taphint { margin-top: auto; padding-top: 14px; text-align: center; pointer-events: none; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* card stage */
.stage { flex: 1; min-height: 0; position: relative; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px 22px; }
.card.enter { animation: rise .32s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(28px); opacity: .0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } }
.kicker { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--era); margin-bottom: 14px; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(25px, 7vw, 31px); line-height: 1.18; margin: 0 0 16px; text-wrap: balance; }
.card p { margin: 0 0 12px; font-size: 17px; line-height: 1.6; max-width: 62ch; }
.card.story { cursor: pointer; }
.card.story h2 { font-size: clamp(27px, 7.6vw, 33px); }
.card.story p { font-size: 18px; line-height: 1.62; }
.card .grow { flex: 1; }

/* listen card */
.work { font-family: var(--f-display); font-size: clamp(22px, 6vw, 27px); line-height: 1.22; margin: 0 0 8px; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.player { margin-block: 26px 18px; display: flex; align-items: center; gap: 18px; }
.play { width: 74px; height: 74px; border-radius: 50%; background: var(--era); color: var(--surface); display: grid; place-items: center; flex: none;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--era) 16%, transparent); transition: transform .15s; }
.play:active { transform: scale(.95); }
.play svg { width: 28px; height: 28px; }
.ptrack { flex: 1; min-width: 0; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--era); }
.ptime { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.note { font-size: 16px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }
.synth { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 12px; }
.synth a { color: inherit; }
.more { align-self: flex-start; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--era); padding: 8px 0; }

/* questions */
.qtext { font-family: var(--f-display); font-size: clamp(21px, 5.6vw, 25px); line-height: 1.28; margin: 0 0 18px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 16.5px; line-height: 1.35;
  background: var(--bg); display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
.opt .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); width: 18px; flex: none; }
.opt:hover:not([disabled]) { border-color: var(--era); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.opt[disabled] { cursor: default; }
.opt.picked { border-color: var(--era); background: color-mix(in srgb, var(--era) 10%, var(--surface)); }
.opt.picked .k { color: var(--era); font-weight: 500; }
.why { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 15.5px; line-height: 1.5;
  background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-left: 3px solid var(--ok); }
.why.no { background: color-mix(in srgb, var(--bad) 8%, var(--surface)); border-left-color: var(--bad); }
.why b { display: block; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.mini { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.mini .play { width: 54px; height: 54px; box-shadow: none; }
.mini .play svg { width: 22px; height: 22px; }
.mini .ptrack { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.review-tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; border: 1px solid var(--era); color: var(--era); margin-bottom: 14px; }

/* done card */
.done-mark { width: 64px; height: 40px; color: var(--era); margin-bottom: 10px; display: block; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: 18px 6px; }
.facts div { border-top: 1px solid var(--line); padding-top: 8px; }
.facts b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.facts span { font-size: 12.5px; color: var(--muted); }

/* photos, hook, stories */
.photo { margin: 0 0 14px; }
.photo img { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: 50% 24%; border-radius: 12px; background: var(--bg); }
.photo.ptop { margin: -8px -6px 16px; }
.photo figcaption { font-family: var(--f-mono); font-size: 10px; color: var(--muted); margin-top: 5px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.photo.vimg img { aspect-ratio: 16 / 9; object-fit: contain; background: #fff; }
.card.hook { padding: 0; overflow: hidden; justify-content: flex-end; border: 0; background: #111317; }
.hbg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.hbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,14,.05) 20%, rgba(10,11,14,.55) 55%, rgba(10,11,14,.94) 100%); }
.hbg.plain { background: linear-gradient(160deg, var(--era), #111317); }
.hin { position: relative; padding: 24px 22px 26px; color: #F4F2EC; }
.hin .kicker { color: #E8C875; }
.hin h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(27px, 7.4vw, 34px); line-height: 1.2; margin: 0 0 12px; color: #FFFFFF; text-wrap: balance; }
.hsub { font-family: var(--f-mono); font-size: 12px; color: rgba(244,242,236,.7); }
.card.storyfull { cursor: pointer; }
.smini { margin: -6px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.smini .play { width: 44px; height: 44px; }
.smini .play svg { width: 18px; height: 18px; }
.sbody.enter { animation: rise .3s cubic-bezier(.2,.8,.2,1); }
@media (prefers-reduced-motion: reduce) { .sbody.enter { animation: none; } }
.stext { font-size: 19px !important; line-height: 1.6 !important; }
.sbody { display: flex; flex-direction: column; flex: 1; }
.sketch { display: block; width: min(78%, 290px); margin: auto auto 0; padding-top: 18px; color: var(--era); opacity: .9; }
@keyframes sk-draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .sketch path { animation: none !important; stroke-dashoffset: 0 !important; } }
.nexts { margin-top: 18px; padding: 14px; border-radius: 12px; border: 1px dashed var(--line); }
.nexts b { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.3; }

/* letters */
.card.chat { padding: 18px 16px 14px; cursor: pointer; }
.chead { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.cht { display: flex; flex-direction: column; min-width: 0; }
.cht b { font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.2; }
.cht span { font-size: 13px; color: var(--muted); }
.cmeta2 { align-self: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin: 12px 0 8px; padding: 3px 10px; border-radius: 99px; background: var(--bg); }
.medal.xs { width: 46px; height: 46px; flex: none; }
.medal.xs span { font-size: 13px; }
.medal.alt { border-color: var(--muted); }
.medal.alt span { color: var(--muted); }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; font-size: 16px; line-height: 1.45; }
.msg i { display: block; font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--era); margin-bottom: 2px; }
.msg.l { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.r { align-self: flex-end; background: color-mix(in srgb, var(--era) 16%, var(--surface)); border-bottom-right-radius: 5px; }
.msg.pop { animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { transform: translateY(8px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.msg.typing { display: flex; gap: 4px; padding: 13px 14px; }
.msg.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dots 1s infinite; }
.msg.typing span:nth-child(2) { animation-delay: .15s; } .msg.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .msg.pop, .msg.typing span { animation: none; } }
.csrc { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-top: 14px; }

/* listening module */
.marks { display: grid; gap: 6px; margin: 2px 0 16px; }
.mark { display: flex; gap: 10px; align-items: baseline; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14.5px; }
.mark .mt { font-family: var(--f-mono); font-size: 12px; color: var(--era); flex: none; min-width: 34px; }
.mark.on { border-color: var(--era); background: color-mix(in srgb, var(--era) 10%, var(--surface)); }
.vsel { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
.vbtn { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 500; }
.vbtn.on { background: var(--era); border-color: var(--era); color: var(--surface); }
.tapzone { display: grid; gap: 12px; margin-bottom: 8px; }
.tapzone .mini { margin-bottom: 0; }
.tline { position: relative; height: 18px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.tline .tp { position: absolute; top: 3px; bottom: 3px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.tline .tg { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 35%, transparent); }
.tapbtn { height: 64px; border-radius: 16px; font-weight: 700; font-size: 19px; background: var(--era); color: var(--surface); }
.tapbtn[disabled] { opacity: .35; }
.tapbtn.pulse { animation: tp .25s ease-out; }
@keyframes tp { from { transform: scale(.96); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .tapbtn.pulse { animation: none; } }

/* pause */
.pausecover { position: absolute; inset: 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid var(--line); }
.pausecover svg { width: 46px; height: 46px; color: var(--era); }
.pausecover .pt { font-family: var(--f-display); font-size: 28px; }
.pausecover .ps { font-size: 15px; color: var(--muted); max-width: 30ch; }

/* parts */
.pcomp { display: flex; gap: 14px; align-items: center; margin: 0 0 16px; }
.pintro { color: var(--muted); font-size: 15.5px !important; }
.plist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.plist li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.plist .pn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--f-mono); font-size: 13px;
  border: 1.5px solid var(--era); color: var(--era); }
.plist .pt2 { display: flex; flex-direction: column; min-width: 0; }
.plist b { font-weight: 600; font-size: 15.5px; }
.plist i { font-style: normal; font-size: 13px; color: var(--muted); }
.plist li.pd .pn { background: var(--era); color: var(--surface); }
.plist li.pc { border-color: var(--era); background: color-mix(in srgb, var(--era) 8%, var(--surface)); }

/* memory, radar, path */
.medal.mini2 { width: 30px; height: 30px; flex: none; border-width: 1px; box-shadow: none; }
.medal.mini2 span { font-size: 10px; }
.medal.mini2 img { inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
.membar { display: block; height: 3px; border-radius: 2px; background: var(--line); margin-top: 5px; max-width: 160px; overflow: hidden; }
.membar i { display: block; height: 100%; background: var(--era); }
.row.fading .st { color: var(--bad); }
.chart svg.radar { width: 100%; height: auto; display: block; overflow: visible; margin: 6px 0 4px; }
.rnote { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.path { margin: 0 0 18px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.ph b { font-weight: 600; font-size: 14px; }
.ph span { font-family: var(--f-mono); font-size: 13px; color: var(--era); }
.pbar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--listen), var(--era)); }
.psub { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.fade { margin: 4px 0 18px; display: grid; gap: 8px; }
.fh { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--bad); }
.frow { display: flex; align-items: center; gap: 12px; }
.frow .dot { width: 12px; height: 12px; }
.ft { flex: 1; min-width: 0; font-size: 15px; }
.fbtn { height: 36px; flex: none; padding-inline: 14px; font-size: 13.5px; }

/* finds */
.heart { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.heart svg { width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 1.7; transition: fill .15s, stroke .15s; }
.heart.on svg { fill: var(--bad); stroke: var(--bad); }
.heart.beat { animation: beat .35s ease-out; }
@keyframes beat { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .heart.beat { animation: none; } }
.finds h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 8px 0 4px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty svg { width: 54px; height: 54px; fill: none; stroke: var(--line); stroke-width: 1.4; }
.taste { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.taste h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.tbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.tleg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
.tleg b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.flist { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.fitem { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.fitem .mini { margin: 0; }
.fitem .ptrack { flex: 1; min-width: 0; }
.fitem .play { background: var(--era); }
.fi-t { font-size: 14.5px; font-weight: 600; color: var(--ink); font-family: var(--f-body); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-m { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }

/* home */

  T("Все три уровня — правильные",
    "Копленд не считал первый уровень «неправильным». Наслаждаться звуком нормально. Но большинство людей на нём и останавливаются: музыка звучит фоном, как обои. Цель этого модуля — добавить третий уровень. Когда слышишь устройство, музыка перестаёт быть фоном: в ней появляются события, которых ждёшь."),
  T("Понимать музыку можно без нот",
    "Исследования психологов музыки показывают: люди без музыкального образования уже многое слышат — возвращение темы, напряжение и разрешение, связь темы и вариаций. Это приходит просто от опыта слушания. Значит, задача не выучить теорию, а научиться замечать и называть то, что ты отчасти уже слышишь."),
  RF("Что для тебя главное, когда нравится музыка?", ["Сам звук: тембр, красота", "Настроение и эмоции", "Интересно, как это сделано", "Не знаю, просто нравится"],
    ["Это первый уровень по Копленду. С него начинают все.", "Это второй уровень, выразительный. Он самый личный.", "Это третий уровень. Ему и посвящён модуль.", "Это честный ответ. После модуля станет понятнее, что именно цепляет."],
    "Через 14 уроков вернись к этому вопросу и посмотри, изменится ли ответ."),

  P(2, "Слушаем внимательно", "Один фрагмент — три уровня"),
  T("Активное слушание",
    "Главный навык — слушать с вопросом. Не «нравится или нет», а «что сейчас происходит?». Этот модуль устроен так: короткий фрагмент, вопрос, ответ сразу. Одни и те же записи будут возвращаться в разных уроках с новыми вопросами. Повторное слушание — главный учитель: с каждым разом слышно больше деталей."),
  LX("r_k525_open", "Моцарт. «Маленькая ночная серенада», I часть", "K. 525 · 1787",
    "Послушай начало трижды: сначала просто звук, потом настроение, потом попробуй заметить, что повторяется."),
  RF("Что ты заметил в первую очередь?", ["Звук струнных", "Бодрое, праздничное настроение", "Что начальная фраза сразу повторяется", "Ничего особенного"],
    ["Уровень звука. Кстати, здесь играет только струнный ансамбль.", "Выразительный уровень. Моцарт писал серенаду как лёгкую вечернюю музыку.", "Это уже устройство: фраза-вопрос и фраза-ответ, к ним вернёмся в уроке о периоде.", "Нормально для первого раза. К концу модуля в этих 30 секундах будет слышно много событий."]),

  P(3, "Закрепляем", "Проверь себя"),
  Q("h00a", "Какой уровень слушания описал Копленд как «чисто музыкальный»?", ["Наслаждение звуком", "Настроение и эмоции", "Устройство: что повторяется и меняется", "Знание биографии автора"], 2,
    "Третий уровень — внимание к самому материалу музыки и её построению."),
  Q("h00b", "Что, по исследованиям, нужно, чтобы слышать связь темы и вариаций?", ["Консерватория", "Знание нот", "Опыт слушания", "Абсолютный слух"], 2,
    "Эти способности приходят от слушания, без формального обучения."),
  Q("h00c", "Почему записи в модуле будут повторяться?", ["Не хватило записей", "Повторное слушание смещает внимание к устройству музыки", "Так проще запомнить названия", "Чтобы было меньше скачивать"], 1,
    "Повтор — главный учитель: с каждым разом слышно больше."),

{ id: "h01", era: "listen", title: "Пульс и метр", parts: 3, cards: [

    "Почти у всей классической музыки есть пульс — ровные удары, как сердцебиение. Их называют долями. Пульс можно отстукивать ногой. Скорость пульса — это темп: медленно, умеренно, быстро. Найти пульс — первое, что стоит делать в любой незнакомой пьесе."),
  withFigs(T("Метр: сильные и слабые доли",
    "Доли неравны: одна сильнее, остальные слабее. Если сильная повторяется через одну — «РАЗ-два, РАЗ-два» — это двухдольный метр, как марш. Если через две — «РАЗ-два-три» — трёхдольный, как вальс или менуэт. Группа долей от сильной до сильной называется тактом."), [{ type: "beats", cap: "Крупные точки — сильные доли, с них начинается такт",
      rows: [{ label: "Марш, на 2", n: 2, bars: 4 }, { label: "Вальс, на 3", n: 3, bars: 3 }, { label: "На 4", n: 4, bars: 2 }] }]),
  T("Размер",
    "В нотах метр записывают дробью в начале: 2/4, 3/4, 4/4. Верхняя цифра — сколько долей в такте. Четырёхдольный метр — это, по сути, два двухдольных подряд: «РАЗ-два-Три-четыре», где третья доля чуть слабее первой. Для слушателя главное различие — «на два» или «на три»."),
  Q("h01a", "Как устроен трёхдольный метр?", ["РАЗ-два, РАЗ-два", "РАЗ-два-три, РАЗ-два-три", "Все доли одинаковые", "Сильная каждая третья нота мелодии"], 1,
    "Сильная доля и две слабых — так звучат вальс и менуэт."),

  P(2, "Слушаем", "Марш против вальса"),
  LX("meter_2", "Учебный марш на 2", "синтез по нотам",

  LX("meter_3", "Учебный вальс на 3", "синтез по нотам",
    "Бас играет на «раз», аккорды — на «два-три». Ум-па-па, ум-па-па."),
  T("Как найти «раз»",
    "Сильную долю выдаёт бас: он чаще всего звучит именно на «раз», а аккомпанемент заполняет слабые доли. Ещё подсказка — смена гармонии: аккорды обычно меняются на сильной доле. Попробуй отстукивать пульс и считать вслух: если счёт «раз-два-три» совпадает с басом, метр трёхдольный."),

  P(3, "Проверь на настоящей музыке", "Штраус, Суза, Моцарт"),

    "Это «На прекрасном голубом Дунае» Иоганна Штрауса: ум-па-па, три доли.", "r_danube"),
  Q("h01c", "На сколько считается этот фрагмент?", ["На 2", "На 3"], 0,
    "Марш Сузы «Comrades of the Legion»: шаг левой-правой, две доли.", "r_sousa"),

{ id: "h02", era: "listen", title: "Темп, громкость, штрихи", parts: 3, cards: [

  T("Почему по-итальянски",
    "Нотная запись в нынешнем виде сложилась в Италии XVII века, и указания исполнителю до сих пор пишут по-итальянски. Темпы от медленного к быстрому: Largo и Adagio (медленно), Andante («шагом»), Moderato (умеренно), Allegro (быстро, буквально «весело»), Presto (очень быстро). Части симфоний часто называют просто по темпу."),
  withFigs(T("Громкость — динамика",
    "Piano (p) — тихо, forte (f) — громко. Pianissimo (pp) — очень тихо, fortissimo (ff) — очень громко. Crescendo — постепенно громче, diminuendo — постепенно тише. Отсюда и название инструмента: на фортепиано впервые можно было играть и тихо, и громко."), [{ type: "dyn", mode: "cresc" }]),
  T("Штрихи",
    "Штрих — способ взять и соединить звуки. Legato — связно, ноты перетекают друг в друга. Staccato — отрывисто, коротко, с промежутками. Pizzicato — струнные играют не смычком, а щипком пальца. Одну и ту же мелодию разные штрихи делают нежной или колючей."),
  Q("h02a", "Что значит Andante?", ["Очень быстро", "«Шагом», неторопливо", "Громко", "Отрывисто"], 1,
    "Andante — от итальянского «идти»: спокойный шаг."),

  P(2, "Слушаем", "Одна мелодия — разные указания"),
  Q("h02b", "Как сыграно? Сравни со следующим вопросом", ["Legato: связно", "Staccato: отрывисто"], 0,
    "Ноты перетекают друг в друга — это legato.", "art_legato"),
  Q("h02c", "А так?", ["Legato: связно", "Staccato: отрывисто"], 1,
    "Короткие ноты с промежутками — staccato.", "art_staccato"),
  Q("h02d", "Что происходит с громкостью?", ["Crescendo: постепенно громче", "Diminuendo: постепенно тише", "Не меняется"], 0,
    "От шёпота к полному звуку — crescendo.", "dyn_cresc"),
  Q("h02e", "Какой темп?", ["Adagio: медленно", "Allegro: быстро"], 0,
    "Первая часть «Лунной сонаты» — Adagio sostenuto.", "r_moon"),

  P(3, "Сюрприз", "Гайдн играет с громкостью"),
  T("Ловушка для ожиданий",
    "Гайдн знал, что слушатель привыкает к громкости. Во второй части Симфонии №94 тихая тема звучит, повторяется ещё тише — и вдруг удар всего оркестра. Здесь звучит сокращённый фрагмент, синтезированный по нотам: тема, её тихий повтор и тот самый аккорд."),
  TAP("h02f", "Нажми «Сейчас!» в момент сюрприза", "haydn_surprise", [12.24],

  Q("h03a", "К какой семье относится валторна?", ["Струнные", "Деревянные духовые", "Медные духовые", "Ударные"], 2,

  VO("Соло и тутти", [{ label: "Соло скрипки", track: "tim_solo" }, { label: "Тутти: весь оркестр", track: "tim_tutti" }],

{ id: "h05", era: "listen", title: "Мажор, минор, напряжение", parts: 3, cards: [

    const W = 340, x0 = 14, x1 = W - 14, yr = y => x0 + (y - 1600) / 350 * (x1 - x0);
    let s = `<svg viewBox="0 0 ${W} 80" class="fsvg" role="img" aria-label="Годы жизни: ${c.b}–${c.d}">`;
    ERA_BANDS.forEach(([e, a, b]) => { s += `<rect x="${yr(a)}" y="40" width="${yr(b) - yr(a) - 1}" height="6" rx="1" fill="var(--${e})" opacity=".28"/>`; });
    (seen || []).filter(k => k !== key && COMPOSERS[k]).forEach(k => { const o = COMPOSERS[k];
      s += `<line x1="${yr(o.b)}" x2="${yr(o.d)}" y1="56" y2="56" stroke="var(--muted)" stroke-width="2" opacity=".35" stroke-linecap="round"/>`; });
    s += `<rect x="${yr(c.b)}" y="36" width="${yr(c.d) - yr(c.b)}" height="14" rx="7" fill="var(--era)"/>`;
    [1600, 1700, 1800, 1900].forEach(y => { s += `<text x="${yr(y)}" y="74" ${MONO} font-size="9.5" fill="var(--muted)" text-anchor="${y === 1600 ? "start" : "middle"}">${y}</text>`; });
    s += `</svg>`;
    return `<figure class="fig comp"><div class="medal" aria-hidden="true" data-key="${esc(key)}" data-wiki="${esc(c.wiki || "")}"><span>${esc(c.ini)}</span></div>
      <div class="cinfo"><div class="cname">${esc(c.name)}</div><div class="cmeta">${c.b}–${c.d} · ${c.d - c.b} лет · ${esc(c.city)}</div></div>${s}</figure>`;
  }

  /* --- era timeline --- */
  function eras() {
    const W = 340, x0 = 8, x1 = W - 8, yr = y => x0 + (y - 1600) / 350 * (x1 - x0);
    let s = `<svg viewBox="0 0 ${W} 108" class="fsvg" role="img" aria-label="Четыре эпохи">`;
    const who = { baroque: "Вивальди · Бах", classical: "Гайдн · Моцарт", romantic: "Шопен · Вагнер", modern: "Дебюсси · Равель" };
    ERA_BANDS.forEach(([e, a, b, n], i) => {
      const x = yr(a), w = yr(b) - yr(a) - 2, last = i === 3, tx = last ? x1 : x + 2, anc = last ? "end" : "start";
      const ny = i % 2 ? 84 : 16, wy = i % 2 ? 98 : 30;
      s += `<rect x="${x}" y="40" width="${w}" height="26" rx="4" fill="var(--${e})"/>`;
      s += `<text x="${tx}" y="${ny}" text-anchor="${anc}" ${BODY} font-size="12.5" font-weight="600" fill="var(--${e})">${n}</text>`;
      s += `<text x="${tx}" y="${wy}" text-anchor="${anc}" ${MONO} font-size="9.5" fill="var(--muted)">${who[e]}</text>`;
      s += `<text x="${x + 4}" y="57" ${MONO} font-size="10" fill="var(--surface)">${a}</text>`;
    });
    s += `</svg>`;
    return wrap(s, "Границы эпох условные: стиль менялся постепенно");
  }

  /* --- orchestra seating --- */
  function orchestra() {
    const cx = 170, cy = 168;
    const arc = (r0, r1, a0, a1, fill, label) => {
      const p = (r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
      const [x1, y1] = p(r1, a0), [x2, y2] = p(r1, a1), [x3, y3] = p(r0, a1), [x4, y4] = p(r0, a0);
      const big = a1 - a0 > Math.PI ? 1 : 0;
      const am = (a0 + a1) / 2, [lx, ly] = p((r0 + r1) / 2, am);
      return `<path d="M${x1},${y1} A${r1},${r1} 0 ${big} 0 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${big} 1 ${x4},${y4}Z" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>
        <text x="${lx}" y="${ly + 4}" text-anchor="middle" ${BODY} font-size="11" font-weight="600" fill="var(--surface)">${label}</text>`;
    };
    const P = Math.PI;
    let s = `<svg viewBox="0 0 340 176" class="fsvg" role="img" aria-label="Схема рассадки оркестра">`;
    s += arc(136, 162, 0.12 * P, 0.88 * P, "var(--muted)", "Ударные");
    s += arc(108, 134, 0.15 * P, 0.85 * P, "var(--romantic)", "Медные");
    s += arc(80, 106, 0.2 * P, 0.8 * P, "var(--modern)", "Деревянные");
    s += arc(22, 78, 0.5 * P, 1.0 * P, "var(--classical)", "Скрипки");
    s += arc(22, 78, 0.0 * P, 0.5 * P, "var(--baroque)", "Виолончели");
    s += `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" ${MONO} font-size="0">.</text>`;
    s += `</svg>`;
    return wrap(s, "Вид сверху, внизу точка — дирижёр. Справа от него альты и виолончели. Чем громче группа, тем дальше она от публики");
  }

  /* --- staff notation --- */
  const LET = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  function staff(spec) {
    const sp = 8, top = 30, bottom = top + 4 * sp, x0 = 24, dx = spec.dx || 34;
    const base = spec.clef === "bass" ? 2 * 7 + 4 : 4 * 7 + 2;
    const notes = spec.notes.split(" ");
    const W = Math.max(340, x0 + notes.length * dx + 20), H = bottom + (spec.labels ? 40 : 22);
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="${esc(spec.aria || "Нотный пример")}">`;
    for (let i = 0; i < 5; i++) s += `<line x1="6" x2="${W - 6}" y1="${top + i * sp}" y2="${top + i * sp}" stroke="var(--muted)" stroke-width="1" opacity=".55"/>`;
    s += `<text x="6" y="${top - 12}" ${MONO} font-size="10" fill="var(--muted)">${spec.clef === "bass" ? "басовый ключ" : ""}</text>`;
    if (spec.dyn) s += `<text x="${x0 - 4}" y="${H - 6}" font-family="Prata, Georgia, serif" font-style="italic" font-size="15" fill="var(--era)">${esc(spec.dyn)}</text>`;
    const xs = [], tips = [];
    notes.forEach((tok, i) => {
      const x = x0 + i * dx + dx / 2; xs.push(x);
      let [p, d] = tok.split("/"); const ferm = d.endsWith("^"); d = d.replace("^", "");
      if (p === "r") { // rest
        const y = top + 2 * sp;
        s += d === "e" ? `<path d="M${x - 2},${y - 4} q3,3 6,-1 L${x},${y + 8}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${x - 1}" cy="${y - 4}" r="2" fill="var(--ink)"/>`
                       : `<path d="M${x - 3},${y - 9} l5,5 l-5,5 l5,5" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
        return;
      }
      const m = p.match(/^([A-G])([#b]?)(\d)$/); const step = (+m[3] * 7 + LET[m[1]]) - base;
      const y = bottom - step * sp / 2;
      for (let l = -2; l >= step; l -= 2) { const ly = bottom - l * sp / 2; s += `<line x1="${x - 9}" x2="${x + 9}" y1="${ly}" y2="${ly}" stroke="var(--muted)" stroke-width="1"/>`; }
      for (let l = 10; l <= step; l += 2) { const ly = bottom - l * sp / 2; s += `<line x1="${x - 9}" x2="${x + 9}" y1="${ly}" y2="${ly}" stroke="var(--muted)" stroke-width="1"/>`; }
      if (m[2]) s += `<text x="${x - 15}" y="${y + 4}" ${BODY} font-size="13" fill="var(--ink)">${m[2] === "#" ? "♯" : "♭"}</text>`;
      const hollow = d === "h" || d === "w";
      s += `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="3.9" transform="rotate(-20 ${x} ${y})" fill="${hollow ? "var(--surface)" : "var(--ink)"}" stroke="var(--ink)" stroke-width="1.4"/>`;
      if (d !== "w") {
        const up = step < 4, sx = up ? x + 5 : x - 5, sy2 = up ? y - 26 : y + 26;
        s += `<line x1="${sx}" x2="${sx}" y1="${y}" y2="${sy2}" stroke="var(--ink)" stroke-width="1.3"/>`;
        tips[i] = [sx, sy2];
        if (d === "e" && !(spec.beams || []).some(([a, b]) => i >= a && i <= b)) s += `<path d="M${sx},${sy2} q7,${up ? 6 : -6} 4,${up ? 14 : -14}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
      }
      if (ferm) s += `<path d="M${x - 7},${top - 8} a7,7 0 0 1 14,0" fill="none" stroke="var(--era)" stroke-width="1.6"/><circle cx="${x}" cy="${top - 9}" r="1.6" fill="var(--era)"/>`;
      if (spec.labels && spec.labels[i]) s += `<text x="${x}" y="${H - 8}" text-anchor="middle" ${MONO} font-size="10" fill="var(--muted)">${esc(spec.labels[i])}</text>`;
    });
    (spec.beams || []).forEach(([a, b]) => { if (tips[a] && tips[b]) s += `<line x1="${tips[a][0]}" y1="${tips[a][1]}" x2="${tips[b][0]}" y2="${tips[b][1]}" stroke="var(--ink)" stroke-width="3.2"/>`; });
    (spec.groups || []).forEach(([a, b, t]) => { const xa = xs[a] - 6, xb = xs[b] + 6;
      s += `<path d="M${xa},${top - 10} v-5 h${xb - xa} v5" fill="none" stroke="var(--era)" stroke-width="1.2"/><text x="${(xa + xb) / 2}" y="${top - 18}" text-anchor="middle" ${MONO} font-size="10" fill="var(--era)">${esc(t)}</text>`; });
    s += `</svg>`;
    return `<figure class="fig"><div class="xscroll">${s}</div>${spec.cap ? `<figcaption>${esc(spec.cap)}</figcaption>` : ""}</figure>`;
  }

  /* --- form blocks (rondo, symphony, canon, fugue, opera) --- */
  function blocks(spec) {
    const W = 340, lw = spec.lw || (spec.rows.some(r => r.label) ? 74 : 0), rh = 30, gap = 8;
    const total = spec.total || Math.max(...spec.rows.map(r => r.blocks.reduce((a, b) => a + (b.w || 1), 0)));
    const unit = (W - lw - 4) / total;
    const H = spec.rows.length * (rh + gap) + 4;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="${esc(spec.aria || "Схема формы")}">`;
    spec.rows.forEach((r, i) => {
      const y = 2 + i * (rh + gap); let x = lw;
      if (r.label) s += `<text x="0" y="${y + rh / 2 + 4}" ${BODY} font-size="11.5" fill="var(--muted)">${esc(r.label)}</text>`;
      r.blocks.forEach(b => {
        const w = (b.w || 1) * unit;
        if (b.t != null) {
          const fill = b.hi ? "var(--era)" : "var(--line)", fg = b.hi ? "var(--surface)" : "var(--ink)";
          s += `<rect x="${x + 1}" y="${y}" width="${w - 3}" height="${rh}" rx="6" fill="${fill}"/>`;
          s += `<text x="${x + w / 2}" y="${y + rh / 2 + 4}" text-anchor="middle" ${BODY} font-size="${b.fs || 12}" font-weight="600" fill="${fg}">${esc(b.t)}</text>`;
        }
        x += w;
      });
    });
    s += `</svg>`;
    return wrap(s, spec.cap);
  }

  /* --- dynamics: terraced vs crescendo; rubato tempo line --- */
  function dyn(mode) {
    const W = 340, H = 110, L = 30, B = 92, T = 14;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="Схема громкости">`;
    s += `<line x1="${L}" x2="${W - 6}" y1="${B}" y2="${B}" stroke="var(--line)"/><line x1="${L}" x2="${L}" y1="${T}" y2="${B}" stroke="var(--line)"/>`;
    const lab = (y, t) => `<text x="${L - 6}" y="${y + 4}" text-anchor="end" font-family="Prata, Georgia, serif" font-style="italic" font-size="13" fill="var(--muted)">${t}</text>`;
    if (mode === "terrace") {
      const f = 26, p = 66; s += lab(f, "f") + lab(p, "p");
      const xs = [L, 90, 150, 210, 270, W - 6], ys = [f, p, f, p, f];
      let d = `M${xs[0]},${ys[0]}`; for (let i = 0; i < ys.length; i++) { d += ` H${xs[i + 1]}`; if (i + 1 < ys.length) d += ` V${ys[i + 1]}`; }
      s += `<path d="${d}" fill="none" stroke="var(--era)" stroke-width="3" stroke-linejoin="round"/>`;
      s += `<text x="${W - 8}" y="${H - 2}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">время →</text>`;
      s += `</svg>`; return wrap(s, "Барокко: громкость меняется ступенями, как террасы");
    }
    if (mode === "cresc") {
      s += lab(22, "ff") + lab(84, "pp");
      s += `<path d="M${L},86 C140,82 230,62 ${W - 30},20 L${W - 22},86" fill="none" stroke="var(--era)" stroke-width="3" stroke-linejoin="round"/>`;
      s += `<text x="${W - 8}" y="${H - 2}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">~15 минут →</text>`;
      s += `</svg>`; return wrap(s, "«Болеро»: одно непрерывное нарастание и обрыв в конце");
    }
    // rubato
    s += lab(53, "темп");
    s += `<line x1="${L}" x2="${W - 6}" y1="53" y2="53" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
    s += `<path d="M${L},53 C70,30 100,30 130,55 S190,82 220,58 S280,28 ${W - 6},50" fill="none" stroke="var(--era)" stroke-width="3"/>`;
    s += `<text x="${W - 8}" y="${H - 2}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">пунктир — ровный темп</text>`;
    s += `</svg>`; return wrap(s, "Рубато: темп дышит вокруг ровной линии");
  }

  /* --- harpsichord vs piano mechanism --- */
  function mech() {
    let s = `<svg viewBox="0 0 340 130" class="fsvg" role="img" aria-label="Механика клавесина и фортепиано">`;
    const string = (x0, x1, y) => `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="2"/>`;
    // harpsichord: jack with plectrum plucking upward
    s += string(16, 154, 40);
    s += `<rect x="72" y="46" width="12" height="54" rx="2" fill="var(--line)" stroke="var(--muted)"/><path d="M84,52 l14,-10" stroke="var(--era)" stroke-width="3" stroke-linecap="round"/>`;
    s += `<path d="M78,108 v-6 M72,104 l6,-6 l6,6" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
    s += `<text x="85" y="126" text-anchor="middle" font-family="Golos Text, sans-serif" font-size="12" font-weight="600" fill="var(--ink)">Клавесин: щипок</text>`;
    // piano: hammer striking from below
    s += string(186, 324, 40);
    s += `<line x1="236" y1="100" x2="252" y2="56" stroke="var(--muted)" stroke-width="3"/><rect x="244" y="44" width="18" height="12" rx="5" fill="var(--era)"/>`;
    s += `<path d="M252,34 l-6,-8 M258,34 l6,-8 M255,32 v-10" stroke="var(--era)" stroke-width="1.5"/>`;
    s += `<text x="255" y="126" text-anchor="middle" font-family="Golos Text, sans-serif" font-size="12" font-weight="600" fill="var(--ink)">Фортепиано: удар</text>`;
    s += `</svg>`;
    return wrap(s, "Перо цепляет струну всегда одинаково, а молоточек бьёт так сильно, как нажал палец");
  }

  /* --- moon over water (Debussy) --- */
  function moon() {
    let s = `<svg viewBox="0 0 340 120" class="fsvg" role="img" aria-label="Луна над водой">`;
    s += `<circle cx="170" cy="40" r="26" fill="var(--era)" opacity=".9"/><circle cx="182" cy="34" r="24" fill="var(--surface)"/>`;
    for (let i = 0; i < 7; i++) { const y = 80 + i * 5.5, w = 70 - i * 8 + (i % 2) * 6;
      s += `<line x1="${170 - w / 2 + (i % 2) * 4}" x2="${170 + w / 2}" y1="${y}" y2="${y}" stroke="var(--era)" stroke-width="2" stroke-linecap="round" opacity="${0.8 - i * 0.09}"/>`; }
    s += `<line x1="20" x2="320" y1="76" y2="76" stroke="var(--line)"/>`;
    s += `</svg>`;
    return wrap(s, "Импрессионизм: не предмет, а впечатление от него");
  }

  const INAME = { violin: "скрипка", strings: "струнные", cello: "виолончель", flute: "флейта", oboe: "гобой", clarinet: "кларнет",
    trumpet: "труба", horn: "валторна", trombone: "тромбон", timpani: "литавры", snare: "малый барабан", organ: "орган",

  function chips(list) {

  /* --- beats: strong and weak beats in bars --- */
  function beats(f) {
    const rows = f.rows; // [{label, n, bars}]
    const W = 340, lw = 78, rh = 34;
    let s = `<svg viewBox="0 0 ${W} ${rows.length * rh + 6}" class="fsvg" role="img" aria-label="Сильные и слабые доли">`;
    rows.forEach((r, k) => {
      const y = 4 + k * rh + rh / 2, total = r.n * r.bars, step = (W - lw - 10) / total;

function hydratePortraits(root) {
  root.querySelectorAll(".medal[data-key]").forEach(m => {
    const key = m.dataset.key, t = m.dataset.wiki;
    const put = (url, onfail) => { const img = new Image(); img.alt = ""; img.onload = () => { m.classList.add("has-img"); m.prepend(img); }; img.onerror = onfail || null; img.src = url; };
    const remote = () => {
      if (!t) return;
      if (portraits[t]) return put(portraits[t]);
      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t)).then(r => r.json()).then(j => {
        const u = j.thumbnail && j.thumbnail.source; if (!u) return;
        portraits[t] = u; try { localStorage.setItem(POR_KEY, JSON.stringify(portraits)); } catch (e) {}
        put(u);
      }).catch(() => {});
    };
    put(`portraits/${key}.jpg`, remote);
  });
}

/* ---------- learning queue ---------- */
let queue = [];   // items: {kind:'lesson', li, ci} | {kind:'review', id} | {kind:'done', li}
let qi = 0;
let answered = null; // for current question: {ok, picked}
let hist = {};       // answers given in this session, by queue position (for going back)
function buildQueue() {
  queue = []; qi = 0; answered = null; hist = {};
  dueList().slice(0, 3).forEach(id => queue.push({ kind: "review", id }));
  pushLesson();
}
function pushLesson() {
  const { li, ci } = S.pos;
  if (li >= LESSONS.length) { queue.push({ kind: "finale" }); return; }
  for (let c = ci; c < LESSONS[li].cards.length; c++) queue.push({ kind: "lesson", li, ci: c });
  queue.push({ kind: "done", li });
}
const item = () => queue[qi];

function eraOf(it) {
  if (!it) return "intro";
  if (it.kind === "review") return LESSONS[QBYID[it.id].li].era;
  if (it.kind === "finale") return "modern";
  return LESSONS[it.li].era;
}

/* ---------- rendering ---------- */
const stage = $("#stage"), actions = $("#actions"), hint = $("#hint");
function setEra(e) { $("#app").style.setProperty("--era", `var(--${e})`); }

/* ---------- lesson parts ---------- */
function partsOf(l) {
  const out = [];
  l.cards.forEach((c, i) => { if (c.t === "part") { if (out.length) out[out.length - 1].end = i; out.push({ n: c.n, title: c.title, sub: c.sub, start: i, end: l.cards.length }); } });
  return out;
}
function partAt(l, ci) { const ps = partsOf(l); let cur = null; ps.forEach(p => { if (ci >= p.start) cur = p; }); return { ps, cur }; }
function partsList(ps, curN, doneN) {
  return `<ol class="plist">${ps.map(p => `<li class="${p.n <= doneN ? "pd" : ""} ${p.n === curN ? "pc" : ""}"><span class="pn">${p.n}</span><span class="pt2"><b>${esc(p.title)}</b><i>${esc(p.sub || "")}</i></span></li>`).join("")}</ol>`;
}
function renderPart(card, c, it) {
  const l = LESSONS[it.li], { ps } = partAt(l, it.ci), E = ERAS[l.era];
  const ck = lessonComposer(l), C = ck && COMPOSERS[ck];
  if (c.n === 1) {
    card.innerHTML = `<div class="kicker">Урок ${it.li + 1} · ${esc(E.name)}${E.years ? " · " + E.years : ""}</div>
      <h2>${esc(l.title)}</h2>
      ${C ? `<div class="pcomp"><div class="medal sm" aria-hidden="true" data-key="${ck}" data-wiki="${esc(C.wiki || "")}"><span>${esc(C.ini)}</span></div><div><div class="cname">${esc(C.name)}</div><div class="cmeta">${C.b}–${C.d} · ${esc(C.city)}</div></div></div>` : ""}
      <p class="pintro">Урок в ${ps.length} частях, каждая на 3–4 минуты. Можно пройти одну часть за заход.</p>
      ${partsList(ps, 1, 0)}`;
    nextBtn("Начать");
  } else {
    card.innerHTML = `<div class="kicker">Урок ${it.li + 1} · часть ${c.n - 1} из ${ps.length} пройдена</div>
      <svg class="done-mark" viewBox="0 0 64 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 32C6 14 18 4 32 4s26 10 26 28"/><circle cx="32" cy="27" r="4.5" fill="currentColor" stroke="none"/></svg>
      <h2>Дальше: ${esc(c.title)}</h2>
      <p class="pintro">${esc(c.sub || "")}. Можно продолжить сейчас или вернуться позже — урок откроется с этого места.</p>
      ${partsList(ps, c.n, c.n - 1)}`;
    actions.innerHTML = `${qi > 0 ? BACK : ""}<button class="btn ghost" id="tohome2">Главная</button><button class="btn" id="next">Часть ${c.n}</button>`;
    $("#next").addEventListener("click", advance); wireBack();
    $("#tohome2").addEventListener("click", () => { S.pos = { li: it.li, ci: it.ci }; save(); buildQueue(); home = true; render(); });
    hint.textContent = "";
  }
}

function paintStaff() {
  const it = item(); const host = $("#staff");
  let total, done;
  if (it && it.kind === "review") { const r = queue.filter(x => x.kind === "review"); total = r.length; done = r.indexOf(it); }
  else if (it && (it.kind === "lesson" || it.kind === "done")) {
    const l = LESSONS[it.li], { cur } = partAt(l, it.kind === "done" ? l.cards.length - 1 : it.ci);
    if (cur) { total = cur.end - cur.start - 1; done = it.kind === "done" ? total : Math.max(0, it.ci - cur.start - 1); }
    else { total = l.cards.length; done = it.kind === "done" ? total : it.ci; }
    if (it.kind === "lesson" && LESSONS[it.li].cards[it.ci].t === "part") { total = 0; }
  }
  if (!total) { host.innerHTML = ""; return; }
  // сторис: по полоске на карточку текущей части
  host.innerHTML = `<div class="segs">${Array.from({ length: total }, (_, i) => `<i class="${i < done ? "f" : i === done ? "c" : ""}"></i>`).join("")}</div>`;
}

function header() {
  const it = item();
  if (!it) return;
  if (it.kind === "review") { $("#lnum").textContent = "Повторение"; $("#lttl").textContent = `${queue.filter(x => x.kind === "review").indexOf(it) + 1} из ${queue.filter(x => x.kind === "review").length}`; return; }
  if (it.kind === "finale") { $("#lnum").textContent = "Финал"; $("#lttl").textContent = "Трек пройден"; return; }
  const l = LESSONS[it.li];
  $("#lnum").textContent = `Урок ${it.li + 1} · ${ERAS[l.era].name}`;
  const { ps, cur } = partAt(l, it.kind === "done" ? l.cards.length - 1 : it.ci);
  $("#lttl").textContent = cur ? `${l.title} · часть ${cur.n}/${ps.length}` : l.title;
}

let home = true;
function lessonComposer(l) { for (const c of l.cards) for (const f of (c.figs || [])) if (f.type === "composer") return f.key; return null; }
function renderHome() {
  home = true; stopAudio();
  const { li, ci } = S.pos, finished = li >= LESSONS.length;

  setEra(l ? l.era : "modern");

  const h = now.getHours(), hello = h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  const ck = l && lessonComposer(l), C = ck && COMPOSERS[ck];
  const total = l ? l.cards.length : 0;
  // whole course as note heads on a staff
  let notes = "";
  LESSONS.forEach((x, i) => {
    const y = [20, 14, 8, 17, 11, 5, 14, 20, 8, 17][i % 10], done = !!S.done[x.id], cur = i === li;
    notes += `<span class="cn ${done ? "on" : ""} ${cur ? "cur" : ""}" style="left:calc(${(i + .5) / LESSONS.length * 100}% - 5px);top:${y}px;--era:var(--${x.era})"></span>`;
  });

  card.className = "card home enter";
  card.innerHTML = `
    <div class="kicker" style="color:var(--muted)">${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}</div>
    <h2 class="hello">${hello}</h2>
    <div class="hstats">
      <div><b>${fmtMin(d.sec)}</b><span>сегодня</span></div>
      <div><b>${streak()}</b><span>дней подряд</span></div>
      <div><b>${Object.keys(S.done).length}/${LESSONS.length}</b><span>уроков</span></div>
    </div>
    ${l ? `<div class="next">
      ${C ? `<div class="medal sm" aria-hidden="true" data-key="${ck}" data-wiki="${esc(C.wiki || "")}"><span>${esc(C.ini)}</span></div>` : `<div class="medal sm" aria-hidden="true"><span>♪</span></div>`}
      <div class="ninfo"><div class="kicker" style="margin:0 0 4px">Урок ${li + 1} · ${esc(ERAS[l.era].name)}</div>
        <div class="ntitle">${esc(l.title)}</div>
        <div class="nmeta">${(() => { const { ps, cur } = partAt(l, Math.min(ci, l.cards.length - 1));
          if (ps.length) return cur && ci > 0 ? `часть ${cur.n} из ${ps.length} · ${esc(cur.title)}` : `${ps.length} части по 3–4 минуты`;

  stage.replaceChildren(card);

  card.querySelectorAll("[data-refresh]").forEach(b => b.addEventListener("click", () => refreshLesson(+b.dataset.refresh)));
  const label = finished ? (due ? "Повторить" : "Открыть программу") : (ci > 0 || due ? "Продолжить" : "Начать урок");
  actions.innerHTML = `<button class="btn" id="go">${label}</button>`;
  hint.textContent = "часть урока — 3–4 минуты";
  $("#go").addEventListener("click", () => {
    if (finished && !due) { showTab("prog"); return; }
    home = false; buildQueue(); render();
  });

/* «Путь слушателя»: прогресс-бар, в котором первые шаги уже засчитаны */
function pathBar() {
  const BONUS = 2, partsOfL = l => l.parts || 1;
  const total = BONUS + LESSONS.reduce((a, l) => a + partsOfL(l), 0);
  let doneU = BONUS + LESSONS.reduce((a, l) => a + (S.done[l.id] ? partsOfL(l) : 0), 0);
  const cl = LESSONS[S.pos.li];
  if (cl && !S.done[cl.id] && S.pos.ci > 0) { const { cur } = partAt(cl, Math.min(S.pos.ci, cl.cards.length - 1)); if (cur) doneU += cur.n - 1; }
  const pct = Math.max(1, Math.round(doneU / total * 100));
  return `<div class="path"><div class="ph"><b>Путь слушателя</b><span>${pct}%</span></div>
    <div class="pbar"><i style="width:${doneU / total * 100}%"></i></div>
    <div class="psub">${doneU <= BONUS ? "Два шага уже позади: ты установил «Антракт» и выбрал классику" : `${doneU - BONUS} из ${total - BONUS} частей пройдено`}</div></div>`;
}
function fadingBlock() {
  const list = LESSONS.map((l, i) => ({ l, i, m: S.done[l.id] ? lessonMemory(l) : null })).filter(x => x.m != null && x.m < 0.75).sort((a, b) => a.m - b.m).slice(0, 2);
  if (!list.length) return "";
  return `<div class="fade"><div class="fh">Тускнеет</div>${list.map(({ l, i, m }) => {
    const ck = lessonComposer(l), C = ck && COMPOSERS[ck];
    return `<div class="frow">${C ? `<span class="medal mini2" aria-hidden="true" data-key="${ck}" data-wiki="${esc(C.wiki || "")}" style="${fadeStyle(m)}"><span>${esc(C.ini)}</span></span>` : `<span class="dot" style="--era:var(--${l.era});opacity:${(0.35 + 0.65 * m).toFixed(2)}"></span>`}
      <span class="ft">${esc(l.title)}<span class="membar"><i style="width:${Math.round(m * 100)}%"></i></span></span>
      <button class="btn ghost fbtn" data-refresh="${i}">Освежить</button></div>`;
  }).join("")}</div>`;
}
function refreshLesson(li) {
  const ids = lessonQs(LESSONS[li]).filter(id => S.cards[id]).sort((a, b) => recall(a) - recall(b)).slice(0, 5);
  queue = ids.map(id => ({ kind: "review", id })); qi = 0; hist = {}; answered = null;
  pushLesson(); home = false; render();
}

/* ---------- истории на минуту ---------- */
let story = null, hookPending = true;
const nextStory = () => STORIES.find(x => !(S.stories || {})[x.id]) || null;
function renderHook(st) {
  setEra(st.era || "listen");
  $(".lhead").hidden = true; $("#staff").hidden = true;
  const card = document.createElement("article");
  card.className = "card hook enter";
  card.innerHTML = `${IC(st.cover) ? `<div class="hbg" style="background-image:url(images/${st.cover}.jpg)"></div>` : `<div class="hbg plain"></div>`}
    <div class="hin"><div class="kicker">История за минуту</div><h2>${esc(st.hook)}</h2><div class="hsub">${esc(st.title)}</div></div>`;
  stage.replaceChildren(card);
  actions.innerHTML = `<button class="btn ghost" id="skip">К уроку</button><button class="btn" id="read">Узнать</button>`;
  hint.textContent = "";
  $("#read").addEventListener("click", () => startStory(st));
  $("#skip").addEventListener("click", () => { hookPending = false; home = true; render(); });
}
function startStory(st) {
  hookPending = false; story = { st, i: 0 };
  stopAudio(); renderStory(true);
}
function drawSketch(root) {
  const svg = $(".sketch", root); if (!svg) return;
  const ps = [...svg.querySelectorAll("path")]; let delay = 250;
  ps.forEach(p => {
    let L = 300; try { L = Math.ceil(p.getTotalLength()) + 2; } catch (e) {}
    const dur = Math.min(1400, 250 + L * 3.2);
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.style.animation = `sk-draw ${dur}ms ease-in-out ${delay}ms forwards`;
    delay += dur * 0.55;
  });
}
function renderStory(fresh) {
  const { st, i } = story, n = st.slides.length;
  setEra(st.era || "listen");
  $(".lhead").hidden = false; $("#staff").hidden = false;
  $("#lnum").textContent = "История"; $("#lttl").textContent = st.title;
  $("#staff").innerHTML = `<div class="segs">${Array.from({ length: n + 1 }, (_, k) => `<i class="${k < i ? "f" : k === i ? "c" : ""}"></i>`).join("")}</div>`;
  let card = $(".card.storyfull", stage);
  if (fresh || !card) {
    card = document.createElement("article");
    card.className = "card storyfull enter";
    card.innerHTML = `${st.track ? `<div class="mini smini"><button class="play" aria-label="Музыка">${ICON.play}</button><div class="ptrack"><div class="bar"><i></i></div><div class="ptime"><span>0:00</span><span>—</span></div></div>${heartBtn(st.track)}</div>` : ""}<div class="sbody"></div>`;
    stage.replaceChildren(card);
    if (st.track) {
      const ui = playerUI(card, st.track);
      wireHeart(card, { title: "Из истории «" + st.title + "»", meta: "", era: st.era });
    }
  }
  const body = $(".sbody", card);
  if (i < n) {
    const sl = st.slides[i], im = sl.img || (i === 0 ? st.cover : null);
    body.innerHTML = `${im ? imgTag(im, "ptop") : ""}<div class="kicker">${i === 0 ? "История за минуту" : `${i + 1} / ${n}`}</div>${i === 0 ? `<h2>${esc(st.title)}</h2>` : ""}<p class="stext">${esc(sl.text)}</p>${sl.sk && SKETCH[sl.sk] ? `<svg class="sketch" viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SKETCH[sl.sk]}</svg>` : ""}`;
    drawSketch(body);
    body.classList.remove("enter"); void body.offsetWidth; body.classList.add("enter");
    actions.innerHTML = `${i > 0 ? BACK : ""}<button class="btn" id="next">Дальше</button>`;
    $("#next").addEventListener("click", () => { story.i++; renderStory(); }); wireBack();
    hint.textContent = "";
  } else {
    S.stories = S.stories || {}; S.stories[st.id] = S.stories[st.id] || Date.now(); save();
    const nx = nextStory();
    body.innerHTML = `<div class="kicker">Конец истории</div>
      <svg class="done-mark" viewBox="0 0 64 36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 32C6 14 18 4 32 4s26 10 26 28"/><circle cx="32" cy="27" r="4.5" fill="currentColor" stroke="none"/></svg>
      <h2>${esc(st.title)}</h2>
      <p class="stext" style="color:var(--muted)">${Object.keys(S.stories).length} из ${STORIES.length} историй прочитано.${st.track ? " Понравилась музыка — поставь ♥, и она будет в «Находках»." : ""}</p>
      ${nx ? `<div class="nexts"><div class="kicker">Следующая</div><b>${esc(nx.hook)}</b></div>` : ""}`;
    actions.innerHTML = `${BACK}<button class="btn ghost" id="tolesson">К уроку</button>${nx ? `<button class="btn" id="more2">Ещё история</button>` : ""}`;
    wireBack();
    $("#tolesson").addEventListener("click", () => { story = null; stopAudio(); home = true; render(); });
    if (nx) $("#more2").addEventListener("click", () => startStory(nx));
  }
}

function render() {
  if (story) return renderStory();
  if (home && hookPending) { const st = nextStory(); hookPending = false; if (st) return renderHook(st); }
  if (home) return renderHome();
  if (paused) { renderCard(); showPaused(); return; }
  renderCard();
}
function renderCard() {
  $(".lhead").hidden = false; $("#staff").hidden = false;
  const it = item();
  setEra(eraOf(it));
  header(); paintStaff();
  stopAudio();
  answered = null;
  const prev = $(".card", stage); if (prev && prev._cleanup) prev._cleanup();
  const card = document.createElement("article");
  card.className = "card enter";
  stage.replaceChildren(card);
  actions.innerHTML = ""; hint.textContent = "";
  if (!it) return;
  if (it.kind === "review") renderQ(card, QBYID[it.id], true);
  else if (it.kind === "done") renderDone(card, it.li);
  else if (it.kind === "finale") renderFinale(card);
  else {
    const c = LESSONS[it.li].cards[it.ci];
    if (c.t === "part") renderPart(card, c, it);
    else if (c.t === "text") renderText(card, c, it);
    else if (c.t === "listen") renderListen(card, c, it);
    else if (c.t === "voices") renderVoices(card, c, it);
    else if (c.t === "reflect") renderReflect(card, c, it);
    else if (c.t === "chat") renderChat(card, c, it);
    else renderQ(card, c, false);
  }
  hydratePortraits(card);
  // preload upcoming audio
  for (let k = qi + 1; k < Math.min(queue.length, qi + 4); k++) {
    const n = queue[k]; let c = n.kind === "lesson" ? LESSONS[n.li].cards[n.ci] : n.kind === "review" ? QBYID[n.id] : null;
    if (c && c.track) probe(c.track, () => {});
  }
}

const BACK = `<button class="btn ghost back" id="back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`;
function wireBack() { const b = $("#back"); if (b) b.addEventListener("click", back); }
const PAUSE = `<button class="btn ghost back" id="pausebtn" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg></button>`;
function wirePause() { const b = $("#pausebtn"); if (b) b.addEventListener("click", pause); }
function nextBtn(label = "Дальше", enabled = true) {
  actions.innerHTML = `${qi > 0 ? BACK : ""}<button class="btn" id="next" ${enabled ? "" : "disabled"}>${label}</button>`;
  $("#next").addEventListener("click", advance); wireBack(); wirePause();
  hint.textContent = "";
}
/* ---------- pause: stops the timer and holds the current card, also across restarts ---------- */
let paused = false;
function pause() {
  const it = item(); if (!it) return;
  paused = true; stopAudio();
  S.paused = { kind: it.kind, id: it.id || null, li: it.li, ci: it.ci, at: Date.now() };
  if (it.kind === "lesson") S.pos = { li: it.li, ci: it.ci };
  save(true);
  showPaused();
}
function showPaused() {
  const ov = document.createElement("div");
  ov.className = "pausecover";
  ov.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>
    <div class="pt">Пауза</div><div class="ps">Таймер остановлен. Можно свернуть приложение — вернёшься на это же место.</div>`;
  stage.appendChild(ov);
  actions.innerHTML = `<button class="btn" id="resume">Продолжить</button>`;
  hint.textContent = "";
  $("#resume").addEventListener("click", resume);
  paintTop();
}
function resume() {
  paused = false; delete S.paused; save(true);
  lastAct = Date.now();
  render();
}

function back() {
  if (story) { if (story.i > 0) { story.i--; renderStory(); } return; }
  if (qi <= 0) return;
  qi--;
  const it = item();
  if (it.kind === "lesson") { S.pos = { li: it.li, ci: it.ci }; save(); }
  render();
}
const figs = (c, it) => (c.figs || []).map(f => FIG.render(f, seenComposers(it))).join("");
function seenComposers(it) {
  const upto = it && it.li != null ? it.li : LESSONS.length;
  const out = [];

/* ---------- картинки ---------- */
const IC = k => (typeof IMGCRED !== "undefined") && IMGCRED[k];
function credit(k) { const c = IC(k); if (!c) return ""; const a = (c.author || "").replace(/\s*\(.*?\)\s*/g, " ").trim(); return `${a ? esc(a.slice(0, 48)) + " · " : ""}${esc(c.license || "")} · Wikimedia Commons`; }
function imgTag(k, cls) { if (!IC(k)) return ""; return `<figure class="photo ${cls || ""}"><img src="images/${k}.jpg" alt="" loading="lazy" decoding="async"><figcaption>${credit(k)}</figcaption></figure>`; }

/* ---------- «Мои находки» ---------- */
const TRACK_ERA = { chorale: "baroque", canon: "baroque", haydn: "classical", r_k525: "classical", r_b5: "classical", r_k265: "classical",
  r_turca: "classical", r_moon: "classical", r_578: "baroque", r_spring: "baroque", r_vltava: "romantic", r_danube: "romantic",
  r_nocturne: "romantic", r_sousa: "modern", r_veni: "intro" };
function eraOfTrack(track, l) {
  if (l && l.era !== "listen") return l.era;
  const k = Object.keys(TRACK_ERA).find(p => track.startsWith(p)); return k ? TRACK_ERA[k] : null;
}
const liked = t => !!(S.likes || {})[t];
function heartBtn(track) { return `<button class="heart ${liked(track) ? "on" : ""}" data-track="${track}" aria-pressed="${liked(track)}" aria-label="В находки"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>`; }
function wireHeart(card, info) {
  card.querySelectorAll(".heart").forEach(h => h.addEventListener("click", () => {
    S.likes = S.likes || {};
    const t = h.dataset.track;
    if (S.likes[t]) delete S.likes[t]; else S.likes[t] = Object.assign({ at: Date.now() }, info);
    h.classList.toggle("on", !!S.likes[t]); h.setAttribute("aria-pressed", !!S.likes[t]);
    if (S.likes[t]) { h.classList.remove("beat"); void h.offsetWidth; h.classList.add("beat"); hint.textContent = "Добавлено в «Находки»"; }
    save(); lastAct = Date.now();
  }));
}
function renderFinds() {
  const L = Object.entries(S.likes || {}).sort((a, b) => b[1].at - a[1].at);
  let html = `<h1>Находки</h1><p class="sub">Фрагменты, которые тебе понравились. Ставь ♥ на карточках «Слушаем».</p>`;
  if (!L.length) {
    html += `<div class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><p>Здесь появится твой плейлист. Нажми на сердечко рядом с плеером, когда фрагмент зацепит.</p></div>`;
    $("#finds").innerHTML = html; return;
  }
  const cnt = {}; L.forEach(([, v]) => { if (v.era && ERAS[v.era] && v.era !== "intro") cnt[v.era] = (cnt[v.era] || 0) + 1; });
  const sum = Object.values(cnt).reduce((a, b) => a + b, 0);
  if (sum) {
    const order = ["baroque", "classical", "romantic", "modern"].filter(e => cnt[e]);
    html += `<div class="taste"><h3>Профиль вкуса</h3><div class="tbar">${order.map(e => `<i style="flex:${cnt[e]};background:var(--${e})"></i>`).join("")}</div>
      <div class="tleg">${order.map(e => `<span><b style="background:var(--${e})"></b>${ERAS[e].name} ${Math.round(cnt[e] / sum * 100)}%</span>`).join("")}</div></div>`;
  }
  html += `<div class="flist">${L.map(([t, v]) => `<div class="fitem" style="--era:var(--${v.era && ERAS[v.era] ? v.era : "listen"})">
      <div class="mini"><button class="play" aria-label="Слушать">${ICON.play}</button><div class="ptrack"><div class="fi-t">${esc(v.title || t)}</div><div class="bar"><i></i></div><div class="ptime"><span>0:00</span><span>—</span></div></div>${heartBtn(t)}</div>
      ${v.meta ? `<div class="fi-m">${esc(v.meta)}</div>` : ""}</div>`).join("")}</div>`;
  $("#finds").innerHTML = html;
  $("#finds").querySelectorAll(".fitem").forEach((el2, i) => {
    const [t, v] = L[i];
    playerUI(el2, t);
    wireHeart(el2, v);
  });
}

/* письма композиторов: сообщения появляются по одному */
function renderChat(card, c, it) {
  const C = COMPOSERS[c.who] || {};
  const av = k => { const P = COMPOSERS[k]; return P ? `<div class="medal xs" aria-hidden="true" data-key="${k}" data-wiki="${esc(P.wiki || "")}"><span>${esc(P.ini)}</span></div>` : `<div class="medal xs alt" aria-hidden="true"><span>${esc((c.toIni || "?"))}</span></div>`; };
  card.classList.add("chat");
  card.innerHTML = `<div class="chead">${av(c.who)}<div class="cht"><b>${esc(C.name || c.who)}</b><span>${esc(c.title)}</span></div></div>
    <div class="cmeta2">${esc(c.date)}</div>
    <div class="msgs" aria-live="polite"></div>
    <div class="grow"></div>
    <div class="csrc">${esc(c.src || "Пересказ подлинного письма, сокращено")}</div>`;
  const box = $(".msgs", card);
  let shown = hist[qi] ? c.msgs.length : 0, busy = false;
  const bubble = m => {
    const mine = m.from === "to";
    return `<div class="msg ${mine ? "r" : "l"}">${!mine && m.name ? `<i>${esc(m.name)}</i>` : mine && m.name ? `<i>${esc(m.name)}</i>` : ""}${esc(m.text)}</div>`;
  };
  const paint = () => { box.innerHTML = c.msgs.slice(0, shown).map(bubble).join(""); };
  const finish = () => { hist[qi] = { read: true }; nextBtn(); };
  const more = () => {
    if (busy || shown >= c.msgs.length) return false;
    busy = true;
    const typing = document.createElement("div");
    typing.className = "msg " + (c.msgs[shown].from === "to" ? "r" : "l") + " typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    box.appendChild(typing);
    typing.scrollIntoView({ block: "end", behavior: "smooth" });
    setTimeout(() => {
      shown++; paint(); busy = false;
      const last = box.lastElementChild; last && last.classList.add("pop");
      last && last.scrollIntoView({ block: "end", behavior: "smooth" });
      if (shown >= c.msgs.length) finish(); else moreBtn();
    }, reduceMotion() ? 0 : 650);
    return true;
  };
  const moreBtn = () => {
    actions.innerHTML = `${qi > 0 ? BACK : ""}<button class="btn" id="more">Дальше в письме</button>`;
    $("#more").addEventListener("click", more); wireBack();
    hint.textContent = `${shown} из ${c.msgs.length}`;
  };
  card._tap = () => (shown < c.msgs.length ? (more(), true) : false);
  paint();
  if (shown >= c.msgs.length) { finish(); return; }
  moreBtn(); more();
}
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function renderReflect(card, c, it) {

    nextBtn();

function renderTap(card, c, head) {
  const tol = c.tol || 2;
  card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>
    <div class="tapzone">
      <div class="mini"><button class="play" aria-label="Слушать">${ICON.play}</button><div class="ptrack"><div class="bar"><i></i></div><div class="ptime"><span>0:00</span><span>—</span></div></div></div>
      <div class="tline" aria-hidden="true"></div>
      <button class="tapbtn" disabled>Сейчас!</button>
    </div>
    <div id="why"></div>`;
  const dur = (XM(c.track) || {}).dur || 30;
  const tline = $(".tline", card), tap = $(".tapbtn", card);
  let taps = [], done = false;
  const ui = playerUI(card, c.track);
  const drawLine = (showTargets) => {
    tline.innerHTML = taps.map(t => `<i class="tp" style="left:${t / dur * 100}%"></i>`).join("") +
      (showTargets ? c.targets.map(t => `<b class="tg" style="left:${(t - tol) / dur * 100}%;width:${2 * tol / dur * 100}%"></b>`).join("") : "");
  };
  const evaluate = () => {
    if (done) return; done = true;
    const hit = c.targets.map(t => taps.some(x => Math.abs(x - t) <= tol));
    const extra = taps.filter(x => !c.targets.some(t => Math.abs(x - t) <= tol)).length;
    const ok = hit.every(Boolean) && extra <= c.targets.length;
    answered = { ok }; hist[qi] = { taps, ok };
    tap.disabled = true; drawLine(true);
    const msg = ok ? c.why : `${hit.filter(Boolean).length} из ${c.targets.length} моментов${extra ? `, лишних нажатий: ${extra}` : ""}. ${c.why}`;
    showWhy(card, ok, msg);
    grade(c.id, ok); save();
    nextBtn();
  };
  tap.addEventListener("click", () => {
    if (done || curTrack !== c.track) return;
    taps.push(el.currentTime); drawLine(false);
    tap.classList.remove("pulse"); void tap.offsetWidth; tap.classList.add("pulse");
  });
  const onTime = () => { if (curTrack === c.track && !el.paused && !done) tap.disabled = false; };
  el.addEventListener("playing", onTime);
  const origDone = ui.done; ui.done = () => { origDone && origDone(); if (taps.length) evaluate(); else tap.disabled = true; };
  // stopping by hand after tapping also finishes the attempt
  $(".play", card).addEventListener("click", () => { if (curTrack !== c.track && taps.length) setTimeout(evaluate, 0); });
  card._cleanup = () => el.removeEventListener("playing", onTime);
  if (hist[qi]) { taps = hist[qi].taps; done = true; answered = { ok: hist[qi].ok }; drawLine(true); showWhy(card, hist[qi].ok, c.why, true); nextBtn(); return; }
  nextBtn("Дальше", false); hint.textContent = "включи запись и нажимай «Сейчас!»";
}

function renderQ(card, c, isReview) {
  const head = isReview ? `<span class="review-tag">Повторение · ${esc(LESSONS[QBYID[c.id].li].title)}</span>` : `<div class="kicker">Вопрос</div>`;
  const audio = c.track ? `<div class="mini"><button class="play" aria-label="Слушать">${ICON.play}</button><div class="ptrack"><div class="bar"><i></i></div><div class="ptime"><span>0:00</span><span>—</span></div></div></div>` : "";
  if (c.kind === "order") return renderOrder(card, c, head);
  if (c.kind === "tap") return renderTap(card, c, head);
  const letters = "АБВГ";
  card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>${audio}
    <div class="opts">${c.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="why"></div>`;
  if (c.track) playerUI(card, c.track);
  const apply = (i, fresh) => {

    card.querySelectorAll(".opt").forEach(x => { x.disabled = true; const j = +x.dataset.i; if (j === c.a) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); });

    if (fresh) { grade(c.id, ok); save(); }
    nextBtn();
  };
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { if (!answered) apply(+b.dataset.i, true); }));
  if (hist[qi]) { apply(hist[qi].i, false); return; }

}

function renderOrder(card, c, head) {
  if (hist[qi]) {
    const pk = hist[qi].picked;
    card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>
      <div class="opts">${pk.map((i, k) => `<button class="opt ${i === k ? "right" : "wrong"}" disabled><span class="k">${k + 1}</span><span>${esc(c.items[i])}</span></button>`).join("")}</div><div id="why"></div>`;
    answered = { ok: pk.every((v, k) => v === k) };
    showWhy(card, answered.ok, c.why, true); nextBtn(); return;
  }
  const shuffled = c.items.map((x, i) => ({ x, i })).sort(() => Math.random() - .5);
  if (shuffled.every((s, k) => s.i === k)) shuffled.reverse();
  const picked = [];
  card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>
    <div class="opts">${shuffled.map(s => `<button class="opt" data-i="${s.i}"><span class="k"></span><span>${esc(s.x)}</span></button>`).join("")}</div><div id="why"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (answered) return;
    const i = +b.dataset.i, at = picked.indexOf(i);
    if (at >= 0) picked.splice(at, 1); else picked.push(i);
    card.querySelectorAll(".opt").forEach(x => { const p = picked.indexOf(+x.dataset.i); x.classList.toggle("picked", p >= 0); $(".k", x).textContent = p >= 0 ? p + 1 : ""; });
    if (picked.length === c.items.length) {
      const ok = picked.every((v, k) => v === k);
      answered = { ok }; hist[qi] = { picked: picked.slice() };
      card.querySelectorAll(".opt").forEach(x => { x.disabled = true; x.classList.remove("picked"); const p = picked.indexOf(+x.dataset.i); x.classList.add(p === +x.dataset.i ? "right" : "wrong"); });
      showWhy(card, ok, c.why);
      grade(c.id, ok); save();
      nextBtn();
    }
  }));
  nextBtn("Дальше", false); hint.textContent = "нажимай по порядку";
}

}
