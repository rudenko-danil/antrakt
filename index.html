function advance() {
  const it = item();
  if (!it) return;
  if (it.kind === "lesson") {
    const c = LESSONS[it.li].cards[it.ci];
    if (c.t === "q" && !answered) return;
    S.pos = { li: it.li, ci: it.ci + 1 };
  } else if (it.kind === "review") {
    if (!answered) return;
  } else if (it.kind === "done") {
    S.done[LESSONS[it.li].id] = S.done[LESSONS[it.li].id] || Date.now();
    S.pos = { li: nextUndone(it.li + 1), ci: 0 };
    queue.splice(qi + 1);
    Object.keys(hist).forEach(k => { if (+k > qi) delete hist[k]; });
    dueList().filter(id => !queue.some(q => q.id === id)).slice(0, 2).forEach(id => queue.push({ kind: "review", id }));
    pushLesson();
  } else return;
  save();
  qi++;
  if (qi >= queue.length) { buildQueue(); }
  render();
}

/* сторис: тап по правой части карточки — дальше, по левой — назад */
const INTERACTIVE = "button, a, input, textarea, .opt, .vbtn, .mark, .player, .mini, .tapzone, .vsel, .heart";
stage.addEventListener("click", e => {
  if ((home && !story) || paused || $("#s-learn").hidden) return;
  if (e.target.closest(INTERACTIVE)) return;
  const sel = window.getSelection && String(window.getSelection()); if (sel) return;
  const card = $(".card", stage); if (!card) return;
  const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < 0.3) { if (qi > 0) back(); return; }
  if (card._tap && card._tap()) return;          // карточка сама обработала тап (письма)
  const b = $("#next"); if (b && !b.disabled) { tapsSeen(); b.click(); }
});
function tapsSeen() { S.ui = S.ui || {}; S.ui.taps = (S.ui.taps || 0) + 1; }
function tapHint(card) {
  if (((S.ui || {}).taps || 0) >= 3) return;
  const h = document.createElement("div"); h.className = "taphint"; h.textContent = "тап справа — дальше · слева — назад";
  card.appendChild(h);
}

document.addEventListener("keydown", e => {
  if ($("#s-learn").hidden || paused) return;
  if (e.key === "Enter" || e.key === "ArrowDown" || e.key === " ") { const b = $("#next"); if (b && !b.disabled && document.activeElement?.tagName !== "BUTTON") { e.preventDefault(); b.click(); } }
});

/* ---------- programme ---------- */
function renderProg() {
  let html = `<h1>Программа</h1><p class="sub">Истории композиторов чередуются с уроками о том, как слушать: сначала судьба и музыка, потом инструмент, чтобы услышать в ней больше</p>`;
  let chap = null;
  LESSONS.forEach((l, i) => {
    if (l.chapter !== chap) { chap = l.chapter; const C = CHAPTERS.find(c => c.id === chap) || { name: "", sub: "", era: l.era };
      const ls = LESSONS.filter(x => x.chapter === chap), dn = ls.filter(x => S.done[x.id]).length;
      html += `<div class="era-h" style="--era:var(--${C.era})"><span class="n">${esc(C.name)}</span><span class="y">${dn}/${ls.length}</span></div><div class="chsub">${esc(C.sub)}</div>`; }
    const done = !!S.done[l.id], curL = S.pos.li === i, mem = done ? lessonMemory(l) : null;
    const due = done && lessonQs(l).some(id => S.cards[id] && S.cards[id].due <= Date.now());
    const st = done ? (due ? "пора повторить" : mem != null ? memWord(mem) : "пройден") : curL ? (S.pos.ci > 0 ? "продолжить" : "следующий") : "";
    const ck = lessonComposer(l), C = ck && COMPOSERS[ck];
    const icon = C ? `<span class="medal mini2" aria-hidden="true" data-key="${ck}" data-wiki="${esc(C.wiki || "")}" style="${fadeStyle(done ? mem : 0.2)}"><span>${esc(C.ini)}</span></span>`
                   : `<span class="dot" style="${done && mem != null ? `opacity:${(0.35 + 0.65 * mem).toFixed(2)}` : ""}"></span>`;
    html += `<button class="row ${done ? "done" : ""} ${curL ? "cur" : ""} ${due || (mem != null && mem < 0.6) ? "fading" : ""}" data-li="${i}" style="--era:var(--${l.era})">
      <span class="no">${String(i + 1).padStart(2, "0")}</span>${icon}<span class="tt">${esc(l.title)}${done && mem != null ? `<span class="membar"><i style="width:${Math.round(mem * 100)}%"></i></span>` : ""}</span><span class="st">${st}</span></button>`;
  });
  const rd = S.stories || {}, nr = STORIES.filter(x => rd[x.id]).length;
  html += `<div class="era-h" style="--era:var(--listen)"><span class="n">Истории за минуту</span><span class="y">${nr}/${STORIES.length}</span></div><div class="chsub">Короткие истории без вопросов — открываются при входе, а здесь их можно перечитать</div>`;
  STORIES.forEach((x, k) => { html += `<button class="row srow ${rd[x.id] ? "done" : ""}" data-st="${k}" style="--era:var(--${x.era})"><span class="no">${String(k + 1).padStart(2, "0")}</span><span class="dot"></span><span class="tt">${esc(x.title)}</span><span class="st">${rd[x.id] ? "прочитана" : ""}</span></button>`; });
  html += `<p class="foot">Портреты и полоски под названиями показывают, насколько крепко ты помнишь урок. Со временем они тускнеют — повторение возвращает цвет. Нажми на любой урок, чтобы пройти или переслушать его.</p>`;
  $("#prog").innerHTML = html;
  hydratePortraits($("#prog"));
  $("#prog").querySelectorAll(".srow").forEach(b => b.addEventListener("click", () => { showTab("learn"); startStory(STORIES[+b.dataset.st]); }));
  $("#prog").querySelectorAll(".row:not(.srow)").forEach(b => b.addEventListener("click", () => {
    const li = +b.dataset.li;
    if (li !== S.pos.li) S.pos = { li, ci: 0 };
    save(); queue = []; qi = 0; hist = {}; pushLesson(); home = false; showTab("learn"); render();
  }));
}

/* ---------- радар навыков ---------- */
function radarSVG() {
  const sc = skillScores(), n = sc.length, W = 340, H = 270, cx = W / 2, cy = 138, Rr = 84;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * Rr * v, cy + Math.sin(a) * Rr * v]; };
  let s = `<svg viewBox="0 0 ${W} ${H}" class="radar" role="img" aria-label="Радар навыков: ${sc.map(x => `${x.name} ${Math.round(x.v * 100)}%`).join(", ")}">`;
  [0.25, 0.5, 0.75, 1].forEach(g => { s += `<polygon points="${sc.map((_, i) => pt(i, g).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  sc.forEach((_, i) => { const [x, y] = pt(i, 1); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  const poly = sc.map((x, i) => pt(i, Math.max(0.03, x.v)).join(",")).join(" ");
  s += `<polygon points="${poly}" fill="color-mix(in srgb, var(--listen) 28%, transparent)" stroke="var(--listen)" stroke-width="2.2" stroke-linejoin="round"/>`;
  sc.forEach((x, i) => { const [px, py] = pt(i, Math.max(0.03, x.v)); s += `<circle cx="${px}" cy="${py}" r="3.5" fill="var(--listen)"/>`; });
  sc.forEach((x, i) => {
    const [lx, ly] = pt(i, 1.17), anc = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end";
    s += `<text x="${lx}" y="${ly}" text-anchor="${anc}" font-family="Golos Text, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="var(--ink)">${esc(x.name)}</text>`;
    s += `<text x="${lx}" y="${ly + 14}" text-anchor="${anc}" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--muted)">${Math.round(x.v * 100)}%</text>`;
  });
  return s + `</svg>`;
}

/* ---------- stats ---------- */
function renderStats() {
  const d = dayRec(), days = [];
  for (let i = 6; i >= 0; i--) { const dt = new Date(Date.now() - i * DAY); const k = todayKey(dt); days.push({ k, dt, sec: (S.days[k] || {}).sec || 0 }); }
  const week = days.reduce((a, x) => a + x.sec, 0);
  const avg = d.opens ? d.sec / d.opens : 0;
  const pct = S.answers.all ? Math.round(S.answers.ok / S.answers.all * 100) : 0;
  const learned = Object.keys(S.cards).length;
  const max = Math.max(300, ...days.map(x => x.sec));
  const niceMax = Math.ceil(max / 300) * 300; // 5-minute steps
  const W_ = 320, H_ = 150, l = 30, b = 22, t = 10, cw = (W_ - l - 4) / 7;
  const y = v => t + (H_ - t - b) * (1 - v / niceMax);
  let svg = `<svg viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Минуты за 7 дней">`;
  [0, niceMax / 2, niceMax].forEach(v => {
    svg += `<line x1="${l}" x2="${W_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
            <text x="${l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(v / 60)}</text>`;
  });
  const wd = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  days.forEach((x, i) => {
    const bx = l + 4 + i * cw + cw * .2, bw = cw * .6, by = y(x.sec), isT = i === 6;
    svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(0, y(0) - by)}" rx="3" fill="${isT ? "var(--ink)" : "var(--muted)"}" opacity="${isT ? 1 : .45}"/>
            <text x="${bx + bw / 2}" y="${H_ - 6}" text-anchor="middle" font-size="10.5" fill="${isT ? "var(--ink)" : "var(--muted)"}" font-family="IBM Plex Mono, monospace">${wd[x.dt.getDay()]}</text>`;
  });
  svg += `</svg>`;
  $("#stats").innerHTML = `<h1>Статистика</h1><p class="sub">Время считается, только пока приложение открыто и ты им пользуешься.</p>
    <div class="tiles">
      <div class="tile"><b>${fmtMin(d.sec)}</b><span>сегодня, мин:сек</span></div>
      <div class="tile"><b>${d.opens}</b><span>заходов сегодня</span></div>
      <div class="tile"><b>${fmtMin(avg)}</b><span>средний заход</span></div>
      <div class="tile"><b>${Math.round(week / 60)}</b><span>минут за 7 дней</span></div>
      <div class="tile"><b>${streak()}</b><span>дней подряд</span></div>
      <div class="tile"><b>${Object.keys(S.done).length}/${LESSONS.length}</b><span>уроков пройдено</span></div>
      <div class="tile"><b>${learned}</b><span>карточек в повторении</span></div>
      <div class="tile"><b>${S.answers.all ? pct + "%" : "—"}</b><span>верных ответов</span></div>
    </div>
    <div class="chart"><h3>Навыки слушателя</h3>${radarSVG()}<p class="rnote">Каждая ось — доля вопросов этой темы, которые ты сейчас помнишь. Пройденное постепенно забывается, и ось сжимается, пока не повторишь.</p></div>
    <div class="chart"><h3>Минуты по дням</h3>${svg}</div>
    <div class="tools"><h3>Резервная копия</h3>
      <div class="rowb"><button class="btn ghost" id="exp">Скопировать прогресс</button><button class="btn ghost" id="imp">Вставить из копии</button><button class="btn ghost" id="rst">Сбросить</button></div>
      <textarea id="io" hidden aria-label="Данные прогресса"></textarea><div class="msg" id="msg"></div></div>
    <div class="sync">${esc(syncNote)}</div>`;
  const io = $("#io"), msg = $("#msg");
  $("#exp").onclick = async () => { io.hidden = false; io.value = JSON.stringify(S); try { await navigator.clipboard.writeText(io.value); msg.textContent = "Скопировано. Сохрани текст в заметках."; } catch (e) { io.select(); msg.textContent = "Выдели текст и скопируй вручную."; } };
  $("#imp").onclick = () => {
    if (io.hidden || !io.value.trim() || io.dataset.mode !== "imp") { io.hidden = false; io.value = ""; io.dataset.mode = "imp"; io.placeholder = "Вставь сюда сохранённый текст и нажми ещё раз"; msg.textContent = ""; return; }
    try { const r = JSON.parse(io.value); if (!r.pos || !r.days) throw 0; S = merge(Object.assign(blank(), r, { updated: Date.now() })); save(true); buildQueue(); msg.textContent = "Прогресс восстановлен."; renderStats(); }
    catch (e) { msg.textContent = "Не получилось прочитать текст. Проверь, что он скопирован целиком."; }
  };
  $("#rst").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.arm) { S = blank(); save(true); buildQueue(); renderStats(); return; }
    b.dataset.arm = "1"; b.textContent = "Точно сбросить всё?"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)";
  };
}

/* ---------- tabs ---------- */
function showTab(t) {
  stopAudio();
  ["learn", "prog", "finds", "stats"].forEach(x => { $("#s-" + x).hidden = x !== t; });
  document.querySelectorAll(".tabs button").forEach(b => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (t === "prog") renderProg();
  if (t === "stats") renderStats();
  if (t === "finds") renderFinds();
  if (t === "learn") { if (home) renderHome(); else setEra(eraOf(item())); }
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.tab === "learn" && !$("#s-learn").hidden && (!home || story)) { story = null; stopAudio(); home = true; render(); return; }
  showTab(b.dataset.tab);
}));
$(".top .brand").addEventListener("click", () => { story = null; showTab("learn"); home = true; render(); });

/* ---------- boot ---------- */
countOpen();
buildQueue();
if (S.paused) {
  const P = S.paused;
  if (P.kind === "review" && QBYID[P.id]) { queue = queue.filter(x => x.id !== P.id); queue.unshift({ kind: "review", id: P.id }); qi = 0; }
  else { queue = queue.filter(x => x.kind !== "review"); qi = 0; }
  home = false; render(); paused = true; showPaused();
} else render();
paintTop();
})();
</script>
