<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Антракт</title>
<meta name="description" content="Классическая музыка мини-уроками">
<meta name="theme-color" content="#EEF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Антракт">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: one phone-width column — status strip, one card at a time, staff-line progress, tab bar. */
:root {
  --bg: #EEF0EB;          /* cool staff-paper */
  --surface: #FAFAF7;
  --ink: #17191E;
  --muted: #5D636E;
  --line: #D6D9D1;
  --ok: #2E7D4F;
  --bad: #B23A3A;
  --baroque: #9A6A12;
  --classical: #2F5D9E;
  --romantic: #9C2F45;
  --modern: #24766D;
  --intro: #555A66;
  --era: var(--intro);
  --f-display: "Prata", "Georgia", "Times New Roman", serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #1A1C21; --ink: #ECEDE8; --muted: #9BA1AB; --line: #2B2E35;
  --ok: #5BBF85; --bad: #E07070;
  --baroque: #D9A541; --classical: #7FA6E0; --romantic: #E07A8F; --modern: #5FC2B6; --intro: #A3A8B3;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1C21; --ink: #ECEDE8; --muted: #9BA1AB; --line: #2B2E35;
  --ok: #5BBF85; --bad: #E07070;
  --baroque: #D9A541; --classical: #7FA6E0; --romantic: #E07A8F; --modern: #5FC2B6; --intro: #A3A8B3;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--era); outline-offset: 3px; border-radius: 6px; }

/* status strip */
.top { display: flex; align-items: center; gap: 12px; padding-block: 12px 6px; font-family: var(--f-mono); font-size: 12px;
  letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.top .brand { font-family: var(--f-display); font-size: 19px; letter-spacing: 0; color: var(--ink); margin-right: auto; cursor: pointer; }
.top b { color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 5px; }
.chip svg { width: 14px; height: 14px; }

/* screens */
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 8px 24px; }

/* lesson header */
.lhead { display: flex; align-items: baseline; gap: 10px; padding-block: 6px 2px; min-width: 0; }
.lhead .num { font-family: var(--f-mono); font-size: 12px; color: var(--era); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.lhead .ttl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* staff progress */
.staff { position: relative; height: 34px; margin-block: 4px 6px; }
.staff svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* card stage */
.stage { flex: 1; min-height: 0; position: relative; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 22px 22px; }
.card.enter { animation: rise .32s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(28px); opacity: .0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } }
.kicker { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--era); margin-bottom: 14px; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(25px, 7vw, 31px); line-height: 1.18; margin: 0 0 16px; text-wrap: balance; }
.card p { margin: 0 0 12px; font-size: 17px; line-height: 1.6; max-width: 62ch; }
.card .grow { flex: 1; }

/* listen card */
.work { font-family: var(--f-display); font-size: clamp(22px, 6vw, 27px); line-height: 1.22; margin: 0 0 8px; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.player { margin-block: 26px 18px; display: flex; align-items: center; gap: 18px; }
.play { width: 74px; height: 74px; border-radius: 50%; background: var(--era); color: var(--surface); display: grid; place-items: center; flex: none;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--era) 16%, transparent); transition: transform .15s; }
.play:active { transform: scale(.95); }
.play svg { width: 28px; height: 28px; }
.ptrack { flex: 1; min-width: 0; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--era); }
.ptime { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.note { font-size: 16px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }
.synth { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 12px; }
.synth a { color: inherit; }
.more { align-self: flex-start; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--era); padding: 8px 0; }

/* questions */
.qtext { font-family: var(--f-display); font-size: clamp(21px, 5.6vw, 25px); line-height: 1.28; margin: 0 0 18px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 16.5px; line-height: 1.35;
  background: var(--bg); display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
.opt .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); width: 18px; flex: none; }
.opt:hover:not([disabled]) { border-color: var(--era); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.opt[disabled] { cursor: default; }
.opt.picked { border-color: var(--era); background: color-mix(in srgb, var(--era) 10%, var(--surface)); }
.opt.picked .k { color: var(--era); font-weight: 500; }
.why { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 15.5px; line-height: 1.5;
  background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-left: 3px solid var(--ok); }
.why.no { background: color-mix(in srgb, var(--bad) 8%, var(--surface)); border-left-color: var(--bad); }
.why b { display: block; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.mini { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.mini .play { width: 54px; height: 54px; box-shadow: none; }
.mini .play svg { width: 22px; height: 22px; }
.mini .ptrack { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.review-tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; border: 1px solid var(--era); color: var(--era); margin-bottom: 14px; }

/* done card */
.done-mark { width: 64px; height: 40px; color: var(--era); margin-bottom: 10px; display: block; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: 18px 6px; }
.facts div { border-top: 1px solid var(--line); padding-top: 8px; }
.facts b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.facts span { font-size: 12.5px; color: var(--muted); }

/* pause */
.pausecover { position: absolute; inset: 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid var(--line); }
.pausecover svg { width: 46px; height: 46px; color: var(--era); }
.pausecover .pt { font-family: var(--f-display); font-size: 28px; }
.pausecover .ps { font-size: 15px; color: var(--muted); max-width: 30ch; }

/* home */
.home .hello { font-size: clamp(30px, 8.5vw, 38px); margin-bottom: 18px; }
.hstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
.hstats div { border-top: 1px solid var(--line); padding-top: 8px; }
.hstats b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.hstats span { font-size: 12.5px; color: var(--muted); }
.next { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px;
  background: color-mix(in srgb, var(--era) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--era) 28%, var(--line)); }
.ninfo { min-width: 0; }
.ntitle { font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.nmeta { font-size: 13px; color: var(--muted); margin-top: 4px; }
.medal.sm { width: 60px; height: 60px; flex: none; }
.course { position: relative; height: 34px; margin-top: 22px; }
.course i { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.cn { position: absolute; width: 10px; height: 8px; border-radius: 50%; transform: rotate(-20deg); box-sizing: border-box;
  border: 1.5px solid color-mix(in srgb, var(--era) 55%, var(--line)); background: var(--surface); }
.cn.on { background: var(--era); border-color: var(--era); }
.cn.cur { border-color: var(--ink); border-width: 2px; }
.ccap { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
.duenote { font-size: 14px; color: var(--muted); margin: 14px 0 0; }

/* figures */
.fig { margin: 0 0 16px; }
.fig figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.fsvg { width: 100%; height: auto; display: block; overflow: visible; }
.xscroll { overflow-x: auto; }
.xscroll .fsvg { min-width: 300px; }
.comp { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 14px; border-radius: 14px;
  background: color-mix(in srgb, var(--era) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--era) 25%, var(--line)); }
.comp .fsvg { grid-column: 1 / -1; margin-top: 4px; }
.medal { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--era);
  box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px color-mix(in srgb, var(--era) 45%, transparent); }
.medal span { font-family: var(--f-display); font-size: 17px; color: var(--era); letter-spacing: .02em; }
.medal { overflow: hidden; position: relative; }
.medal img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); object-fit: cover; object-position: center 20%; border-radius: 50%; }
.medal.has-img span { visibility: hidden; }
.cname { font-family: var(--f-display); font-size: 18px; line-height: 1.2; }
.cmeta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.insts { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 16px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 99px; font-size: 13px;
  border: 1px solid var(--line); background: var(--bg); }
.ichip svg { width: 18px; height: 18px; color: var(--era); }
.bigicon { width: 96px; height: 96px; display: block; margin: 0 auto; }
.btn.back { flex: 0 0 54px; padding: 0; display: grid; place-items: center; }
.btn.back svg { width: 22px; height: 22px; }

/* action row */
.actions { padding-block: 12px 10px; display: flex; gap: 10px; }
.btn { flex: 1; height: 54px; border-radius: 14px; font-weight: 600; font-size: 16.5px; background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; padding-inline: 18px; font-weight: 500; }
.btn[disabled] { opacity: .35; cursor: default; }
.hint { text-align: center; font-size: 12px; color: var(--muted); font-family: var(--f-mono); padding-bottom: 2px; min-height: 16px; }

/* tab bar */
.tabs { display: flex; border-top: 1px solid var(--line); padding-bottom: 4px; }
.tabs button { flex: 1; padding-block: 10px 6px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* programme */
.prog h1, .stats h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 8px 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.era-h { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.era-h .n { font-family: var(--f-display); font-size: 21px; }
.era-h .y { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.era-h .tm { font-family: var(--f-display); font-style: italic; font-size: 14px; color: var(--era); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 11px 2px; border-bottom: 1px dashed var(--line); }
.row .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); width: 22px; flex: none; font-variant-numeric: tabular-nums; }
.row .tt { flex: 1; min-width: 0; font-size: 16px; }
.row .st { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); flex: none; }
.row.done .st { color: var(--era); }
.row.cur .tt { font-weight: 600; }
.row.cur .st { color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--era); flex: none; }
.row.done .dot { background: var(--era); }
.foot { font-size: 13px; color: var(--muted); margin-top: 26px; line-height: 1.5; }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 13px; color: var(--muted); }
.chart { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px; }
.chart h3, .tools h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.chart svg { width: 100%; height: 150px; display: block; }
.tools { margin-top: 18px; }
.tools .rowb { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .btn { height: 44px; font-size: 14.5px; flex: 1 1 140px; }
.tools textarea { width: 100%; min-height: 90px; margin-top: 10px; font-family: var(--f-mono); font-size: 12px; background: var(--surface);
  color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-sizing: border-box; }
.msg { font-size: 13.5px; color: var(--muted); margin-top: 8px; min-height: 20px; }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 18px; }
</style>

<div class="app" id="app">
  <header class="top">
    <span class="brand">Антракт</span>
    <span class="chip" title="Дней подряд"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5c2.5 3 4 5 4 7.5a4 4 0 0 1-8 0c0-1.4.6-2.6 1.6-3.6.2 1.3.9 2 1.7 2.3C6.9 5.6 7.3 3.4 8 1.5Z"/></svg><b id="streak">0</b></span>
    <span class="chip" title="Минут сегодня"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8.5" r="6"/><path d="M8 5v3.5l2.2 1.4"/></svg><b id="today">0:00</b></span>
  </header>

  <section class="screen" id="s-learn">
    <div class="lhead"><span class="num" id="lnum"></span><span class="ttl" id="lttl"></span></div>
    <div class="staff" id="staff" aria-hidden="true"></div>
    <div class="stage" id="stage"></div>
    <div class="actions" id="actions"></div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="screen" id="s-prog" hidden>
    <div class="scroll prog" id="prog"></div>
  </section>

  <section class="screen" id="s-stats" hidden>
    <div class="scroll stats" id="stats"></div>
  </section>

  <nav class="tabs" aria-label="Разделы">
    <button data-tab="learn" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Слушать</button>
    <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Программа</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</button>
  </nav>
</div>

<script>
// Контент трека «Классическая музыка: база»
const T = (h, b) => ({ t: "text", h, b });
const L = (track, work, meta, note) => ({ t: "listen", track, work, meta, note });
const Q = (id, q, opts, a, why, track) => ({ t: "q", kind: "choice", id, q, opts, a, why, track });
const O = (id, q, items, why) => ({ t: "q", kind: "order", id, q, items, why });

const ERAS = {
  intro:     { name: "Вступление", years: "", tempo: "Preludio" },
  baroque:   { name: "Барокко", years: "1600–1750", tempo: "Allegro" },
  classical: { name: "Классицизм", years: "1750–1820", tempo: "Andante" },
  romantic:  { name: "Романтизм", years: "1820–1900", tempo: "Espressivo" },
  modern:    { name: "XX век", years: "1900–", tempo: "Rubato" },
};
const ERA_OPTS = ["Барокко", "Классицизм", "Романтизм", "XX век"];

const LESSONS = [
{ id: "l01", era: "intro", title: "Что такое классическая музыка", cards: [
  T("Два значения одного слова",
    "«Классической» в быту называют всю академическую музыку от Баха до Рахманинова. А в учебниках классицизм — это одна конкретная эпоха, время Гайдна, Моцарта и раннего Бетховена. В этом курсе слово «классика» значит первое, широкое."),
  T("Четыре эпохи",
    "Удобнее всего слушать музыку по эпохам. Барокко (1600–1750) — пышность и узоры. Классицизм (1750–1820) — ясность и порядок. Романтизм (1820–1900) — чувства на пределе. XX век — эксперименты и новые краски. Границы условные, но за месяц ты научишься слышать разницу."),
  L("l01_ode", "Бетховен. Симфония №9, финал: «Ода к радости»", "op. 125 · 1824",

const FIG = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MONO = 'font-family="IBM Plex Mono, ui-monospace, monospace"';
  const BODY = 'font-family="Golos Text, system-ui, sans-serif"';
  const wrap = (svg, cap) => `<figure class="fig">${svg}${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure>`;
  const ERA_BANDS = [["baroque", 1600, 1750, "Барокко"], ["classical", 1750, 1820, "Классицизм"], ["romantic", 1820, 1900, "Романтизм"], ["modern", 1900, 1950, "XX век"]];

  /* --- composer card: medallion + lifespan on the era axis --- */
  function composer(key, seen) {
    const c = COMPOSERS[key]; if (!c) return "";
    const W = 340, x0 = 14, x1 = W - 14, yr = y => x0 + (y - 1600) / 350 * (x1 - x0);
    let s = `<svg viewBox="0 0 ${W} 80" class="fsvg" role="img" aria-label="Годы жизни: ${c.b}–${c.d}">`;
    ERA_BANDS.forEach(([e, a, b]) => { s += `<rect x="${yr(a)}" y="40" width="${yr(b) - yr(a) - 1}" height="6" rx="1" fill="var(--${e})" opacity=".28"/>`; });
    (seen || []).filter(k => k !== key && COMPOSERS[k]).forEach(k => { const o = COMPOSERS[k];
      s += `<line x1="${yr(o.b)}" x2="${yr(o.d)}" y1="56" y2="56" stroke="var(--muted)" stroke-width="2" opacity=".35" stroke-linecap="round"/>`; });
    s += `<rect x="${yr(c.b)}" y="36" width="${yr(c.d) - yr(c.b)}" height="14" rx="7" fill="var(--era)"/>`;
    [1600, 1700, 1800, 1900].forEach(y => { s += `<text x="${yr(y)}" y="74" ${MONO} font-size="9.5" fill="var(--muted)" text-anchor="${y === 1600 ? "start" : "middle"}">${y}</text>`; });
    s += `</svg>`;
    return `<figure class="fig comp"><div class="medal" aria-hidden="true" data-key="${esc(key)}" data-wiki="${esc(c.wiki || "")}"><span>${esc(c.ini)}</span></div>
      <div class="cinfo"><div class="cname">${esc(c.name)}</div><div class="cmeta">${c.b}–${c.d} · ${c.d - c.b} лет · ${esc(c.city)}</div></div>${s}</figure>`;
  }

  /* --- era timeline --- */
  function eras() {
    const W = 340, x0 = 8, x1 = W - 8, yr = y => x0 + (y - 1600) / 350 * (x1 - x0);
    let s = `<svg viewBox="0 0 ${W} 108" class="fsvg" role="img" aria-label="Четыре эпохи">`;
    const who = { baroque: "Вивальди · Бах", classical: "Гайдн · Моцарт", romantic: "Шопен · Вагнер", modern: "Дебюсси · Равель" };
    ERA_BANDS.forEach(([e, a, b, n], i) => {
      const x = yr(a), w = yr(b) - yr(a) - 2, last = i === 3, tx = last ? x1 : x + 2, anc = last ? "end" : "start";
      const ny = i % 2 ? 84 : 16, wy = i % 2 ? 98 : 30;
      s += `<rect x="${x}" y="40" width="${w}" height="26" rx="4" fill="var(--${e})"/>`;
      s += `<text x="${tx}" y="${ny}" text-anchor="${anc}" ${BODY} font-size="12.5" font-weight="600" fill="var(--${e})">${n}</text>`;
      s += `<text x="${tx}" y="${wy}" text-anchor="${anc}" ${MONO} font-size="9.5" fill="var(--muted)">${who[e]}</text>`;
      s += `<text x="${x + 4}" y="57" ${MONO} font-size="10" fill="var(--surface)">${a}</text>`;
    });
    s += `</svg>`;
    return wrap(s, "Границы эпох условные: стиль менялся постепенно");
  }

  /* --- orchestra seating --- */
  function orchestra() {
    const cx = 170, cy = 168;
    const arc = (r0, r1, a0, a1, fill, label) => {
      const p = (r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
      const [x1, y1] = p(r1, a0), [x2, y2] = p(r1, a1), [x3, y3] = p(r0, a1), [x4, y4] = p(r0, a0);
      const big = a1 - a0 > Math.PI ? 1 : 0;
      const am = (a0 + a1) / 2, [lx, ly] = p((r0 + r1) / 2, am);
      return `<path d="M${x1},${y1} A${r1},${r1} 0 ${big} 0 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${big} 1 ${x4},${y4}Z" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>
        <text x="${lx}" y="${ly + 4}" text-anchor="middle" ${BODY} font-size="11" font-weight="600" fill="var(--surface)">${label}</text>`;
    };
    const P = Math.PI;
    let s = `<svg viewBox="0 0 340 176" class="fsvg" role="img" aria-label="Схема рассадки оркестра">`;
    s += arc(136, 162, 0.12 * P, 0.88 * P, "var(--muted)", "Ударные");
    s += arc(108, 134, 0.15 * P, 0.85 * P, "var(--romantic)", "Медные");
    s += arc(80, 106, 0.2 * P, 0.8 * P, "var(--modern)", "Деревянные");
    s += arc(22, 78, 0.5 * P, 1.0 * P, "var(--classical)", "Скрипки");
    s += arc(22, 78, 0.0 * P, 0.5 * P, "var(--baroque)", "Виолончели");
    s += `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" ${MONO} font-size="0">.</text>`;
    s += `</svg>`;
    return wrap(s, "Вид сверху, внизу точка — дирижёр. Справа от него альты и виолончели. Чем громче группа, тем дальше она от публики");
  }

  /* --- staff notation --- */
  const LET = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  function staff(spec) {
    const sp = 8, top = 30, bottom = top + 4 * sp, x0 = 24, dx = spec.dx || 34;
    const base = spec.clef === "bass" ? 2 * 7 + 4 : 4 * 7 + 2;
    const notes = spec.notes.split(" ");
    const W = Math.max(340, x0 + notes.length * dx + 20), H = bottom + (spec.labels ? 40 : 22);
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="${esc(spec.aria || "Нотный пример")}">`;
    for (let i = 0; i < 5; i++) s += `<line x1="6" x2="${W - 6}" y1="${top + i * sp}" y2="${top + i * sp}" stroke="var(--muted)" stroke-width="1" opacity=".55"/>`;
    s += `<text x="6" y="${top - 12}" ${MONO} font-size="10" fill="var(--muted)">${spec.clef === "bass" ? "басовый ключ" : ""}</text>`;
    if (spec.dyn) s += `<text x="${x0 - 4}" y="${H - 6}" font-family="Prata, Georgia, serif" font-style="italic" font-size="15" fill="var(--era)">${esc(spec.dyn)}</text>`;
    const xs = [], tips = [];
    notes.forEach((tok, i) => {
      const x = x0 + i * dx + dx / 2; xs.push(x);
      let [p, d] = tok.split("/"); const ferm = d.endsWith("^"); d = d.replace("^", "");
      if (p === "r") { // rest
        const y = top + 2 * sp;
        s += d === "e" ? `<path d="M${x - 2},${y - 4} q3,3 6,-1 L${x},${y + 8}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${x - 1}" cy="${y - 4}" r="2" fill="var(--ink)"/>`
                       : `<path d="M${x - 3},${y - 9} l5,5 l-5,5 l5,5" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
        return;
      }
      const m = p.match(/^([A-G])([#b]?)(\d)$/); const step = (+m[3] * 7 + LET[m[1]]) - base;
      const y = bottom - step * sp / 2;
      for (let l = -2; l >= step; l -= 2) { const ly = bottom - l * sp / 2; s += `<line x1="${x - 9}" x2="${x + 9}" y1="${ly}" y2="${ly}" stroke="var(--muted)" stroke-width="1"/>`; }
      for (let l = 10; l <= step; l += 2) { const ly = bottom - l * sp / 2; s += `<line x1="${x - 9}" x2="${x + 9}" y1="${ly}" y2="${ly}" stroke="var(--muted)" stroke-width="1"/>`; }
      if (m[2]) s += `<text x="${x - 15}" y="${y + 4}" ${BODY} font-size="13" fill="var(--ink)">${m[2] === "#" ? "♯" : "♭"}</text>`;
      const hollow = d === "h" || d === "w";
      s += `<ellipse cx="${x}" cy="${y}" rx="5.4" ry="3.9" transform="rotate(-20 ${x} ${y})" fill="${hollow ? "var(--surface)" : "var(--ink)"}" stroke="var(--ink)" stroke-width="1.4"/>`;
      if (d !== "w") {
        const up = step < 4, sx = up ? x + 5 : x - 5, sy2 = up ? y - 26 : y + 26;
        s += `<line x1="${sx}" x2="${sx}" y1="${y}" y2="${sy2}" stroke="var(--ink)" stroke-width="1.3"/>`;
        tips[i] = [sx, sy2];
        if (d === "e" && !(spec.beams || []).some(([a, b]) => i >= a && i <= b)) s += `<path d="M${sx},${sy2} q7,${up ? 6 : -6} 4,${up ? 14 : -14}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
      }
      if (ferm) s += `<path d="M${x - 7},${top - 8} a7,7 0 0 1 14,0" fill="none" stroke="var(--era)" stroke-width="1.6"/><circle cx="${x}" cy="${top - 9}" r="1.6" fill="var(--era)"/>`;
      if (spec.labels && spec.labels[i]) s += `<text x="${x}" y="${H - 8}" text-anchor="middle" ${MONO} font-size="10" fill="var(--muted)">${esc(spec.labels[i])}</text>`;
    });
    (spec.beams || []).forEach(([a, b]) => { if (tips[a] && tips[b]) s += `<line x1="${tips[a][0]}" y1="${tips[a][1]}" x2="${tips[b][0]}" y2="${tips[b][1]}" stroke="var(--ink)" stroke-width="3.2"/>`; });
    (spec.groups || []).forEach(([a, b, t]) => { const xa = xs[a] - 6, xb = xs[b] + 6;
      s += `<path d="M${xa},${top - 10} v-5 h${xb - xa} v5" fill="none" stroke="var(--era)" stroke-width="1.2"/><text x="${(xa + xb) / 2}" y="${top - 18}" text-anchor="middle" ${MONO} font-size="10" fill="var(--era)">${esc(t)}</text>`; });
    s += `</svg>`;
    return `<figure class="fig"><div class="xscroll">${s}</div>${spec.cap ? `<figcaption>${esc(spec.cap)}</figcaption>` : ""}</figure>`;
  }

  /* --- form blocks (rondo, symphony, canon, fugue, opera) --- */
  function blocks(spec) {
    const W = 340, lw = spec.lw || (spec.rows.some(r => r.label) ? 74 : 0), rh = 30, gap = 8;
    const total = spec.total || Math.max(...spec.rows.map(r => r.blocks.reduce((a, b) => a + (b.w || 1), 0)));
    const unit = (W - lw - 4) / total;
    const H = spec.rows.length * (rh + gap) + 4;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="${esc(spec.aria || "Схема формы")}">`;
    spec.rows.forEach((r, i) => {
      const y = 2 + i * (rh + gap); let x = lw;
      if (r.label) s += `<text x="0" y="${y + rh / 2 + 4}" ${BODY} font-size="11.5" fill="var(--muted)">${esc(r.label)}</text>`;
      r.blocks.forEach(b => {
        const w = (b.w || 1) * unit;
        if (b.t != null) {
          const fill = b.hi ? "var(--era)" : "var(--line)", fg = b.hi ? "var(--surface)" : "var(--ink)";
          s += `<rect x="${x + 1}" y="${y}" width="${w - 3}" height="${rh}" rx="6" fill="${fill}"/>`;
          s += `<text x="${x + w / 2}" y="${y + rh / 2 + 4}" text-anchor="middle" ${BODY} font-size="${b.fs || 12}" font-weight="600" fill="${fg}">${esc(b.t)}</text>`;
        }
        x += w;
      });
    });
    s += `</svg>`;
    return wrap(s, spec.cap);
  }

  /* --- dynamics: terraced vs crescendo; rubato tempo line --- */
  function dyn(mode) {
    const W = 340, H = 110, L = 30, B = 92, T = 14;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="Схема громкости">`;
    s += `<line x1="${L}" x2="${W - 6}" y1="${B}" y2="${B}" stroke="var(--line)"/><line x1="${L}" x2="${L}" y1="${T}" y2="${B}" stroke="var(--line)"/>`;
    const lab = (y, t) => `<text x="${L - 6}" y="${y + 4}" text-anchor="end" font-family="Prata, Georgia, serif" font-style="italic" font-size="13" fill="var(--muted)">${t}</text>`;
    if (mode === "terrace") {
      const f = 26, p = 66; s += lab(f, "f") + lab(p, "p");
      const xs = [L, 90, 150, 210, 270, W - 6], ys = [f, p, f, p, f];
      let d = `M${xs[0]},${ys[0]}`; for (let i = 0; i < ys.length; i++) { d += ` H${xs[i + 1]}`; if (i + 1 < ys.length) d += ` V${ys[i + 1]}`; }
      s += `<path d="${d}" fill="none" stroke="var(--era)" stroke-width="3" stroke-linejoin="round"/>`;
      s += `<text x="${W - 8}" y="${H - 2}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">время →</text>`;
      s += `</svg>`; return wrap(s, "Барокко: громкость меняется ступенями, как террасы");
    }

  resolveSrc(track);
  const a = (typeof AUDIO !== "undefined") && AUDIO[track];
  if (src) src.textContent = a ? "Запись: Wikimedia Commons" : "Фрагмент синтезирован по нотам";
  return ui;
}

/* ---------- composer portraits (Wikipedia summary thumbnails) ---------- */
const POR_KEY = "antrakt.portraits.v1";
let portraits = {}; try { portraits = JSON.parse(localStorage.getItem(POR_KEY) || "{}"); } catch (e) {}
function hydratePortraits(root) {
  root.querySelectorAll(".medal[data-key]").forEach(m => {
    const key = m.dataset.key, t = m.dataset.wiki;
    const put = (url, onfail) => { const img = new Image(); img.alt = ""; img.onload = () => { m.classList.add("has-img"); m.prepend(img); }; img.onerror = onfail || null; img.src = url; };
    const remote = () => {
      if (!t) return;
      if (portraits[t]) return put(portraits[t]);
      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t)).then(r => r.json()).then(j => {
        const u = j.thumbnail && j.thumbnail.source; if (!u) return;
        portraits[t] = u; try { localStorage.setItem(POR_KEY, JSON.stringify(portraits)); } catch (e) {}
        put(u);
      }).catch(() => {});
    };
    put(`portraits/${key}.jpg`, remote);
  });
}

/* ---------- learning queue ---------- */
let queue = [];   // items: {kind:'lesson', li, ci} | {kind:'review', id} | {kind:'done', li}
let qi = 0;
let answered = null; // for current question: {ok, picked}
let hist = {};       // answers given in this session, by queue position (for going back)
function buildQueue() {
  queue = []; qi = 0; answered = null; hist = {};
  dueList().slice(0, 3).forEach(id => queue.push({ kind: "review", id }));
  pushLesson();
}
function pushLesson() {
  const { li, ci } = S.pos;
  if (li >= LESSONS.length) { queue.push({ kind: "finale" }); return; }
  for (let c = ci; c < LESSONS[li].cards.length; c++) queue.push({ kind: "lesson", li, ci: c });
  queue.push({ kind: "done", li });
}
const item = () => queue[qi];

function eraOf(it) {
  if (!it) return "intro";
  if (it.kind === "review") return LESSONS[QBYID[it.id].li].era;
  if (it.kind === "finale") return "modern";
  return LESSONS[it.li].era;
}

/* ---------- rendering ---------- */
const stage = $("#stage"), actions = $("#actions"), hint = $("#hint");
function setEra(e) { $("#app").style.setProperty("--era", `var(--${e})`); }

function paintStaff() {
  const it = item(); const host = $("#staff");
  let total, done;
  if (it && it.kind === "review") { const r = queue.filter(x => x.kind === "review"); total = r.length; done = r.indexOf(it); }
  else if (it && (it.kind === "lesson" || it.kind === "done")) { total = LESSONS[it.li].cards.length; done = it.kind === "done" ? total : it.ci; }
  else { host.innerHTML = ""; return; }
  const w = 1000, h = 34, pad = 16, step = (w - pad * 2) / Math.max(1, total);
  let s = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`;
  for (let i = 0; i < 5; i++) s += `<line x1="0" x2="${w}" y1="${5 + i * 6}" y2="${5 + i * 6}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  s += `</svg>`;
  // note heads as HTML so they keep their shape at any width
  let heads = "";
  for (let i = 0; i < total; i++) {
    const x = (pad + step * (i + .5)) / w * 100, y = [23, 17, 11, 20, 14, 8, 17, 23, 11][i % 9];
    const filled = i < done, now = i === done;
    heads += `<span style="position:absolute;left:calc(${x}% - 6px);top:${y - 4}px;width:12px;height:9px;border-radius:50%;transform:rotate(-20deg);
      ${filled ? "background:var(--era)" : `border:1.5px solid ${now ? "var(--ink)" : "var(--line)"};box-sizing:border-box;background:var(--surface)`}"></span>`;
  }
  host.innerHTML = s + heads;
}

function header() {

let home = true;
function lessonComposer(l) { for (const c of l.cards) for (const f of (c.figs || [])) if (f.type === "composer") return f.key; return null; }
function renderHome() {

function render() {
  if (home) return renderHome();
  if (paused) { renderCard(); showPaused(); return; }
  renderCard();
}
function renderCard() {
  $(".lhead").hidden = false; $("#staff").hidden = false;
  const it = item();
  setEra(eraOf(it));
  header(); paintStaff();
  stopAudio();
  answered = null;
  const card = document.createElement("article");
  card.className = "card enter";
  stage.replaceChildren(card);
  actions.innerHTML = ""; hint.textContent = "";
  if (!it) return;
  if (it.kind === "review") renderQ(card, QBYID[it.id], true);
  else if (it.kind === "done") renderDone(card, it.li);
  else if (it.kind === "finale") renderFinale(card);
  else {
    const c = LESSONS[it.li].cards[it.ci];
    if (c.t === "text") renderText(card, c, it);
    else if (c.t === "listen") renderListen(card, c, it);
    else renderQ(card, c, false);
  }
  hydratePortraits(card);
  // preload upcoming audio
  for (let k = qi + 1; k < Math.min(queue.length, qi + 4); k++) {
    const n = queue[k]; let c = n.kind === "lesson" ? LESSONS[n.li].cards[n.ci] : n.kind === "review" ? QBYID[n.id] : null;
    if (c && c.track) probe(c.track, () => {});
  }
}

const BACK = `<button class="btn ghost back" id="back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`;
function wireBack() { const b = $("#back"); if (b) b.addEventListener("click", back); }
const PAUSE = `<button class="btn ghost back" id="pausebtn" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg></button>`;
function wirePause() { const b = $("#pausebtn"); if (b) b.addEventListener("click", pause); }
function nextBtn(label = "Дальше", enabled = true) {
  actions.innerHTML = `${qi > 0 ? BACK : ""}${PAUSE}<button class="btn" id="next" ${enabled ? "" : "disabled"}>${label}</button>`;
  $("#next").addEventListener("click", advance); wireBack(); wirePause();
  hint.textContent = "";
}
/* ---------- pause: stops the timer and holds the current card, also across restarts ---------- */
let paused = false;
function pause() {
  const it = item(); if (!it) return;
  paused = true; stopAudio();
  S.paused = { kind: it.kind, id: it.id || null, li: it.li, ci: it.ci, at: Date.now() };
  if (it.kind === "lesson") S.pos = { li: it.li, ci: it.ci };
  save(true);
  showPaused();
}
function showPaused() {
  const ov = document.createElement("div");
  ov.className = "pausecover";
  ov.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>
    <div class="pt">Пауза</div><div class="ps">Таймер остановлен. Можно свернуть приложение — вернёшься на это же место.</div>`;
  stage.appendChild(ov);
  actions.innerHTML = `<button class="btn" id="resume">Продолжить</button>`;

}
function resume() {
  paused = false; delete S.paused; save(true);
  lastAct = Date.now();

}

function back() {
  if (qi <= 0) return;
  qi--;
  const it = item();
  if (it.kind === "lesson") { S.pos = { li: it.li, ci: it.ci }; save(); }
  render();
}
const figs = (c, it) => (c.figs || []).map(f => FIG.render(f, seenComposers(it))).join("");
function seenComposers(it) {
  const upto = it && it.li != null ? it.li : LESSONS.length;
  const out = [];
  LESSONS.slice(0, upto + 1).forEach(l => l.cards.forEach(c => (c.figs || []).forEach(f => { if (f.type === "composer") out.push(f.key); })));
  return out;
}

function renderText(card, c, it) {
  card.innerHTML = `<div class="kicker">${esc(ERAS[LESSONS[it.li].era].name)}${ERAS[LESSONS[it.li].era].years ? " · " + ERAS[LESSONS[it.li].era].years : ""}</div>
    <h2>${esc(c.h)}</h2>${figs(c, it)}<p>${esc(c.b)}</p>`;

}

function renderListen(card, c, it) {
  card.innerHTML = `<div class="kicker">Слушаем</div>

function renderQ(card, c, isReview) {
  const head = isReview ? `<span class="review-tag">Повторение · ${esc(LESSONS[QBYID[c.id].li].title)}</span>` : `<div class="kicker">Вопрос</div>`;
  const audio = c.track ? `<div class="mini"><button class="play" aria-label="Слушать">${ICON.play}</button><div class="ptrack"><div class="bar"><i></i></div><div class="ptime"><span>0:00</span><span>—</span></div></div></div>` : "";
  if (c.kind === "order") return renderOrder(card, c, head);
  const letters = "АБВГ";
  card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>${audio}
    <div class="opts">${c.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="why"></div>`;
  if (c.track) playerUI(card, c.track);
  const apply = (i, fresh) => {
    const ok = i === c.a;
    answered = { ok }; hist[qi] = { i };
    card.querySelectorAll(".opt").forEach(x => { x.disabled = true; const j = +x.dataset.i; if (j === c.a) x.classList.add("right"); else if (j === i) x.classList.add("wrong"); });
    showWhy(card, ok, c.why, !fresh);
    if (fresh) { grade(c.id, ok); save(); }
    nextBtn();
  };
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { if (!answered) apply(+b.dataset.i, true); }));
  if (hist[qi]) { apply(hist[qi].i, false); return; }
  nextBtn("Дальше", false); hint.textContent = "выбери ответ";
}

function renderOrder(card, c, head) {
  if (hist[qi]) {
    const pk = hist[qi].picked;
    card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>
      <div class="opts">${pk.map((i, k) => `<button class="opt ${i === k ? "right" : "wrong"}" disabled><span class="k">${k + 1}</span><span>${esc(c.items[i])}</span></button>`).join("")}</div><div id="why"></div>`;
    answered = { ok: pk.every((v, k) => v === k) };
    showWhy(card, answered.ok, c.why, true); nextBtn(); return;
  }
  const shuffled = c.items.map((x, i) => ({ x, i })).sort(() => Math.random() - .5);
  if (shuffled.every((s, k) => s.i === k)) shuffled.reverse();
  const picked = [];
  card.innerHTML = `${head}<div class="qtext">${esc(c.q)}</div>
    <div class="opts">${shuffled.map(s => `<button class="opt" data-i="${s.i}"><span class="k"></span><span>${esc(s.x)}</span></button>`).join("")}</div><div id="why"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (answered) return;
    const i = +b.dataset.i, at = picked.indexOf(i);
    if (at >= 0) picked.splice(at, 1); else picked.push(i);
    card.querySelectorAll(".opt").forEach(x => { const p = picked.indexOf(+x.dataset.i); x.classList.toggle("picked", p >= 0); $(".k", x).textContent = p >= 0 ? p + 1 : ""; });
    if (picked.length === c.items.length) {
      const ok = picked.every((v, k) => v === k);
      answered = { ok }; hist[qi] = { picked: picked.slice() };
      card.querySelectorAll(".opt").forEach(x => { x.disabled = true; x.classList.remove("picked"); const p = picked.indexOf(+x.dataset.i); x.classList.add(p === +x.dataset.i ? "right" : "wrong"); });
      showWhy(card, ok, c.why);
      grade(c.id, ok); save();
      nextBtn();
    }
  }));
  nextBtn("Дальше", false); hint.textContent = "нажимай по порядку";
}

function showWhy(card, ok, why, quiet) {

  box.innerHTML = `<div class="why ${ok ? "" : "no"}"><b>${ok ? "Верно" : "Не совсем"}</b>${esc(why)}</div>`;

  actions.innerHTML = due ? `<button class="btn" id="next">Повторить</button>` : `<button class="btn ghost" id="next" style="flex:1">Открыть программу</button>`;
  $("#next").addEventListener("click", () => { if (due) { buildQueue(); render(); } else showTab("prog"); });
}

function advance() {
  const it = item();
  if (!it) return;
  if (it.kind === "lesson") {
    const c = LESSONS[it.li].cards[it.ci];
    if (c.t === "q" && !answered) return;
    S.pos = { li: it.li, ci: it.ci + 1 };
  } else if (it.kind === "review") {
    if (!answered) return;
  } else if (it.kind === "done") {
    S.done[LESSONS[it.li].id] = S.done[LESSONS[it.li].id] || Date.now();
    S.pos = { li: it.li + 1, ci: 0 };
    queue.splice(qi + 1);
    Object.keys(hist).forEach(k => { if (+k > qi) delete hist[k]; });
    dueList().filter(id => !queue.some(q => q.id === id)).slice(0, 2).forEach(id => queue.push({ kind: "review", id }));
    pushLesson();
  } else return;
  save();
  qi++;
  if (qi >= queue.length) { buildQueue(); }
  render();
}

document.addEventListener("keydown", e => {

    const st = done ? "пройден" : curL ? (S.pos.ci > 0 ? "продолжить" : "следующий") : "";
    html += `<button class="row ${done ? "done" : ""} ${curL ? "cur" : ""}" data-li="${i}" style="--era:var(--${l.era})">
      <span class="no">${String(i + 1).padStart(2, "0")}</span><span class="dot"></span><span class="tt">${esc(l.title)}</span><span class="st">${st}</span></button>`;
  });
  html += `<p class="foot">Аудио — короткие фрагменты, синтезированные по нотам: сами произведения давно в общественном достоянии. Нажми на любой урок, чтобы пройти или переслушать его.</p>`;
  $("#prog").innerHTML = html;
  $("#prog").querySelectorAll(".row").forEach(b => b.addEventListener("click", () => {
    const li = +b.dataset.li;
    if (li !== S.pos.li) S.pos = { li, ci: 0 };
    save(); queue = []; qi = 0; hist = {}; pushLesson(); home = false; showTab("learn"); render();
  }));
}

/* ---------- stats ---------- */
function renderStats() {
  const d = dayRec(), days = [];
  for (let i = 6; i >= 0; i--) { const dt = new Date(Date.now() - i * DAY); const k = todayKey(dt); days.push({ k, dt, sec: (S.days[k] || {}).sec || 0 }); }
  const week = days.reduce((a, x) => a + x.sec, 0);
  const avg = d.opens ? d.sec / d.opens : 0;
  const pct = S.answers.all ? Math.round(S.answers.ok / S.answers.all * 100) : 0;
  const learned = Object.keys(S.cards).length;
  const max = Math.max(300, ...days.map(x => x.sec));
  const niceMax = Math.ceil(max / 300) * 300; // 5-minute steps
  const W_ = 320, H_ = 150, l = 30, b = 22, t = 10, cw = (W_ - l - 4) / 7;
  const y = v => t + (H_ - t - b) * (1 - v / niceMax);
  let svg = `<svg viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Минуты за 7 дней">`;
  [0, niceMax / 2, niceMax].forEach(v => {
    svg += `<line x1="${l}" x2="${W_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
            <text x="${l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(v / 60)}</text>`;
  });
  const wd = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  days.forEach((x, i) => {
    const bx = l + 4 + i * cw + cw * .2, bw = cw * .6, by = y(x.sec), isT = i === 6;
    svg += `<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(0, y(0) - by)}" rx="3" fill="${isT ? "var(--ink)" : "var(--muted)"}" opacity="${isT ? 1 : .45}"/>
            <text x="${bx + bw / 2}" y="${H_ - 6}" text-anchor="middle" font-size="10.5" fill="${isT ? "var(--ink)" : "var(--muted)"}" font-family="IBM Plex Mono, monospace">${wd[x.dt.getDay()]}</text>`;
  });
  svg += `</svg>`;
  $("#stats").innerHTML = `<h1>Статистика</h1><p class="sub">Время считается, только пока приложение открыто и ты им пользуешься.</p>
    <div class="tiles">
      <div class="tile"><b>${fmtMin(d.sec)}</b><span>сегодня, мин:сек</span></div>
      <div class="tile"><b>${d.opens}</b><span>заходов сегодня</span></div>
      <div class="tile"><b>${fmtMin(avg)}</b><span>средний заход</span></div>
      <div class="tile"><b>${Math.round(week / 60)}</b><span>минут за 7 дней</span></div>
      <div class="tile"><b>${streak()}</b><span>дней подряд</span></div>
      <div class="tile"><b>${Object.keys(S.done).length}/${LESSONS.length}</b><span>уроков пройдено</span></div>
      <div class="tile"><b>${learned}</b><span>карточек в повторении</span></div>
      <div class="tile"><b>${S.answers.all ? pct + "%" : "—"}</b><span>верных ответов</span></div>
    </div>
    <div class="chart"><h3>Минуты по дням</h3>${svg}</div>
    <div class="tools"><h3>Резервная копия</h3>
      <div class="rowb"><button class="btn ghost" id="exp">Скопировать прогресс</button><button class="btn ghost" id="imp">Вставить из копии</button><button class="btn ghost" id="rst">Сбросить</button></div>
      <textarea id="io" hidden aria-label="Данные прогресса"></textarea><div class="msg" id="msg"></div></div>
    <div class="sync">${esc(syncNote)}</div>`;
  const io = $("#io"), msg = $("#msg");
  $("#exp").onclick = async () => { io.hidden = false; io.value = JSON.stringify(S); try { await navigator.clipboard.writeText(io.value); msg.textContent = "Скопировано. Сохрани текст в заметках."; } catch (e) { io.select(); msg.textContent = "Выдели текст и скопируй вручную."; } };
  $("#imp").onclick = () => {
    if (io.hidden || !io.value.trim() || io.dataset.mode !== "imp") { io.hidden = false; io.value = ""; io.dataset.mode = "imp"; io.placeholder = "Вставь сюда сохранённый текст и нажми ещё раз"; msg.textContent = ""; return; }
    try { const r = JSON.parse(io.value); if (!r.pos || !r.days) throw 0; S = merge(Object.assign(blank(), r, { updated: Date.now() })); save(true); buildQueue(); msg.textContent = "Прогресс восстановлен."; renderStats(); }
    catch (e) { msg.textContent = "Не получилось прочитать текст. Проверь, что он скопирован целиком."; }
  };
  $("#rst").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.arm) { S = blank(); save(true); buildQueue(); renderStats(); return; }
    b.dataset.arm = "1"; b.textContent = "Точно сбросить всё?"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)";
  };
}

/* ---------- tabs ---------- */
function showTab(t) {
  stopAudio();
  ["learn", "prog", "stats"].forEach(x => { $("#s-" + x).hidden = x !== t; });
  document.querySelectorAll(".tabs button").forEach(b => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (t === "prog") renderProg();
  if (t === "stats") renderStats();
  if (t === "learn") { if (home) renderHome(); else setEra(eraOf(item())); }
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.tab === "learn" && !$("#s-learn").hidden && !home) { home = true; render(); return; }
  showTab(b.dataset.tab);
}));
$(".top .brand").addEventListener("click", () => { showTab("learn"); home = true; render(); });

/* ---------- boot ---------- */
countOpen();
buildQueue();
if (S.paused) {
  const P = S.paused;
  if (P.kind === "review" && QBYID[P.id]) { queue = queue.filter(x => x.id !== P.id); queue.unshift({ kind: "review", id: P.id }); qi = 0; }
  else { queue = queue.filter(x => x.kind !== "review"); qi = 0; }
  home = false; render(); paused = true; showPaused();
} else render();
paintTop();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
